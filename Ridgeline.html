<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridgeline</title>
<style>
  :root{
    --bg:#060a11; --sidebar:rgba(8,14,25,.92); --sidebar-2:rgba(56,189,248,.10);
    --primary:#38bdf8; --primary-dark:#0ea5e9;
    --text:#e9f1fb; --muted:#8ba3c2; --border:rgba(120,170,235,.14);
    --border-hi:rgba(125,190,255,.34);
    --card:rgba(17,27,44,.72); --card-solid:#111b2c;
    --green:#34d399; --red:#f87171; --amber:#fbbf24;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.45);
    --glow:0 0 0 1px rgba(56,189,248,.18), 0 0 28px rgba(56,189,248,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;}
  /* Two cold light sources and a faint grid. Fixed, so it reads as a surface
     the content sits on rather than something that scrolls with it. */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(1100px 620px at 12% -12%, rgba(56,189,248,.13), transparent 62%),
      radial-gradient(900px 520px at 108% 4%, rgba(129,140,248,.10), transparent 58%),
      linear-gradient(180deg,#0a1523 0%, #060a11 46%);}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
    background-image:linear-gradient(rgba(120,170,235,.05) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(120,170,235,.05) 1px, transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(1000px 700px at 30% 0%, #000 30%, transparent 78%);}
  /* Figures line up column to column. On a dashboard that is not decoration. */
  .value,.bv,.stat .value,.est-sum-row,.totals{font-variant-numeric:tabular-nums;}
  .app{display:flex;min-height:100vh;}

  .splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:#060a11;z-index:100;color:var(--muted);}
  .spinner{width:38px;height:38px;border:4px solid rgba(56,189,248,.18);border-top-color:var(--primary);
    border-radius:50%;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .auth-wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:
       radial-gradient(900px 500px at 20% 0%, rgba(56,189,248,.16), transparent 60%),
       linear-gradient(160deg,#0b1727,#05080f);padding:20px;z-index:90;}
  .auth-card{background:rgba(16,26,42,.86);border:1px solid var(--border-hi);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-radius:16px;width:100%;max-width:400px;padding:32px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);}
  .auth-logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;}
  .auth-logo .mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;}
  .auth-sub{color:var(--muted);font-size:13px;margin:6px 0 22px;}
  .auth-tabs{display:flex;gap:6px;margin-bottom:20px;background:rgba(255,255,255,.05);padding:4px;border-radius:9px;}
  .auth-tabs button{flex:1;padding:8px;border:none;background:none;border-radius:7px;cursor:pointer;
    font-weight:600;font-size:13px;color:var(--muted);}
  .auth-tabs button.active{background:rgba(56,189,248,.18);color:#eaf7ff;box-shadow:none;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;}
  .auth-btn{width:100%;background:linear-gradient(180deg,#4cc5fb,#0ea5e9);color:#04121d;border:none;padding:11px;border-radius:9px;
    font-weight:700;cursor:pointer;font-size:14px;}
  .auth-btn:hover{background:var(--primary-dark);}
  .auth-btn:disabled{opacity:.6;cursor:default;}
  .auth-err{color:var(--red);font-size:12.5px;margin-top:12px;min-height:16px;}
  .auth-msg{color:var(--green);font-size:12.5px;margin-top:8px;}

  .loading{position:fixed;inset:0;background:rgba(3,7,14,.6);backdrop-filter:blur(2px);display:none;
    align-items:center;justify-content:center;z-index:80;}
  .loading.show{display:flex;}

  .sidebar{width:230px;background:var(--sidebar);color:var(--text);display:flex;flex-direction:column;
    position:fixed;top:0;bottom:0;left:0;border-right:1px solid var(--border);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
  .logo{padding:16px 20px;font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px;text-shadow:0 0 18px rgba(56,189,248,.35);
    display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);}
  .logo .mark{width:30px;height:30px;border-radius:7px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:15px;}
  .nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
  .nav a{display:flex;align-items:center;gap:11px;padding:8px 13px;border-radius:8px;
    color:#b6c8e0;text-decoration:none;font-weight:500;cursor:pointer;transition:.12s;}
  .nav a:hover{background:var(--sidebar-2);color:#fff;}
  .nav a.active{background:linear-gradient(90deg,rgba(56,189,248,.22),rgba(56,189,248,.06));
    color:#eaf7ff;box-shadow:inset 2px 0 0 var(--primary);}
  .nav a .ico{width:18px;text-align:center;font-size:15px;}
  .nav a .pill{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
    border-radius:10px;padding:1px 7px;}
  .nav .label-sm{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#6d86a8;
    padding:10px 13px 4px;font-weight:700;}
  .user-box{padding:12px;border-top:1px solid var(--border);}
  .user-box .em{color:var(--text);font-weight:600;font-size:12px;word-break:break-all;margin-bottom:9px;
    display:flex;align-items:center;gap:7px;}
  .user-box .em .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .user-box button{width:100%;background:rgba(255,255,255,.05);color:#b6c8e0;border:1px solid var(--border);
    padding:8px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;margin-top:5px;}
  .user-box button:hover{background:rgba(56,189,248,.14);color:#fff;border-color:var(--border-hi);}

  .main{margin-left:230px;flex:1;padding:26px 32px 60px;width:calc(100% - 230px);}
  .view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;
    flex-wrap:wrap;gap:14px;}
  .view-head h1{font-size:23px;font-weight:700;}
  .view-head p{color:var(--muted);font-size:13px;margin-top:2px;}

  .btn{background:linear-gradient(180deg,#4cc5fb,#0ea5e9);color:#04121d;border:none;padding:9px 16px;border-radius:8px;
    box-shadow:0 0 18px rgba(56,189,248,.22);
    font-weight:600;cursor:pointer;font-size:13px;transition:.12s;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border);box-shadow:none;}
  .btn.secondary:hover{background:rgba(56,189,248,.12);border-color:var(--border-hi);}
  .btn.danger{background:var(--red);}
  .btn.danger{color:#1a0505;}
  .btn.danger:hover{filter:brightness(1.1);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;
    padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:rgba(255,255,255,.07);color:var(--text);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;
    box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    position:relative;overflow:hidden;transition:border-color .15s,transform .15s;}
  /* A hairline of light along the top edge, brighter on the one you point at. */
  .stat::after{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(125,190,255,.45),transparent);opacity:.6;}
  .stat:hover{border-color:var(--border-hi);transform:translateY(-1px);}
  .stat .label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .stat .value{font-size:26px;font-weight:700;margin-top:6px;}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .stat .value.green{color:var(--green);} .stat .value.red{color:var(--red);}
  .stat .value.blue{color:var(--primary);} .stat .value.amber{color:var(--amber);}

  .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
    padding:18px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .panel h3{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .panel h3 .count{font-size:12px;color:var(--muted);font-weight:500;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    padding:10px 12px;border-bottom:1px solid var(--border);font-weight:700;}
  td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(56,189,248,.06);}
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .name-link{color:var(--primary);font-weight:600;cursor:pointer;}
  .name-link:hover{text-decoration:underline;}
  tr.missed td{background:rgba(248,113,113,.10);}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge{border:1px solid transparent;}
  .b-lead{background:rgba(56,189,248,.15);color:#7dd3fc;border-color:rgba(56,189,248,.30);}
  .b-customer{background:rgba(52,211,153,.15);color:#6ee7b7;border-color:rgba(52,211,153,.30);}
  .b-gray{background:rgba(139,163,194,.13);color:#a9bdd8;border-color:rgba(139,163,194,.24);}
  .b-green{background:rgba(52,211,153,.15);color:#6ee7b7;border-color:rgba(52,211,153,.30);}
  .b-amber{background:rgba(251,191,36,.15);color:#fcd34d;border-color:rgba(251,191,36,.30);}
  .b-red{background:rgba(248,113,113,.15);color:#fca5a5;border-color:rgba(248,113,113,.30);}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],
  input[type=password],select,textarea{font-family:inherit;font-size:13px;padding:8px 11px;
    border:1px solid var(--border);border-radius:8px;background:rgba(6,12,22,.6);color:var(--text);width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(56,189,248,.45);border-color:var(--primary);}
  .search{max-width:280px;} .filter{max-width:180px;}

  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
  .col{min-width:236px;width:236px;flex-shrink:0;background:rgba(10,18,32,.55);border-radius:11px;padding:10px;
    border:1px solid var(--border);}
  .col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:2px 4px;}
  .col-head .ct{font-weight:700;font-size:13px;}
  .col-head .sum{font-size:11px;color:var(--muted);font-weight:600;}
  .col.drag-over{outline:2px dashed var(--primary);outline-offset:-3px;}
  .deal{background:var(--card-solid);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:9px;
    cursor:grab;box-shadow:var(--shadow);transition:border-color .15s;}
  .deal:hover{border-color:var(--border-hi);}
  .deal:active{cursor:grabbing;}
  .deal .dt{font-weight:600;font-size:13px;margin-bottom:3px;}
  .deal .dc{font-size:12px;color:var(--muted);}
  .deal .dmini{font-size:11px;color:var(--muted);margin-top:3px;}
  .deal .dv{font-weight:700;color:var(--green);font-size:13px;margin-top:6px;}
  .deal .dmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .deal .dmeta small{color:var(--muted);font-size:11px;}
  .col-stripe{height:3px;border-radius:3px;margin-bottom:9px;}

  .ai-action{background:rgba(56,189,248,.10);border-left:3px solid var(--primary);padding:6px 9px;
    border-radius:0 6px 6px 0;font-size:11.5px;color:var(--primary-dark);margin-top:8px;}
  .ai-action .lbl{font-weight:700;text-transform:uppercase;font-size:8.5px;letter-spacing:.6px;
    display:block;opacity:.8;}
  .ai-action{color:#9fd8f7;}
  .rev-done{margin-top:8px;font-size:11.5px;font-weight:700;color:#5eead4;}
  .ck-row{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .ck-row:last-child{border-bottom:none;}
  .ck-mark{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;flex-shrink:0;}
  .ck-mark.done{background:rgba(52,211,153,.16);color:#6ee7b7;}
  .ck-mark.todo{background:rgba(251,191,36,.16);color:#fcd34d;}
  .ck-mark.soon{background:rgba(139,163,194,.12);color:#7b90ad;}
  .ck-label.pending{color:var(--muted);}
  .ws-back{font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:4px;display:inline-block;}
  .ws-back:hover{color:var(--primary);}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:6px;}
  .photo-tile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;
    border:1px solid var(--border);background:rgba(255,255,255,.04);}
  .photo-tile img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block;}
  .photo-loading{display:flex;align-items:center;justify-content:center;height:100%;
    font-size:11px;color:var(--muted);}
  .photo-del{position:absolute;top:4px;right:4px;background:rgba(15,23,42,.7);color:#fff;border:none;
    width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1;}
  .photo-del:hover{background:var(--red);}
  .photo-add{aspect-ratio:1;border:2px dashed var(--border);border-radius:8px;display:flex;
    align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:11.5px;
    font-weight:600;text-align:center;line-height:1.3;}
  .photo-add:hover{border-color:var(--primary);color:var(--primary);background:rgba(56,189,248,.08);}
  .est-sum-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;}
  .est-sum-row.total{border-top:2px solid var(--border);margin-top:5px;padding-top:9px;
    font-weight:700;font-size:15px;color:var(--text);}

  .overlay{position:fixed;inset:0;background:rgba(3,7,14,.72);backdrop-filter:blur(3px);display:none;
    align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:#0e1726;border:1px solid var(--border-hi);border-radius:14px;width:100%;max-width:560px;
    box-shadow:0 24px 70px rgba(0,0,0,.65), var(--glow);}
  .modal.wide{max-width:720px;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;
    justify-content:space-between;align-items:center;}
  .modal-head h2{font-size:17px;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;
    justify-content:flex-end;gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:#b6c8e0;margin-bottom:5px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:8px;}
  .detail-grid .dl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;}
  .detail-grid .dv{font-size:13px;margin-top:1px;}
  .sub-section{margin-top:18px;}
  .sub-section h4{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .mini-item{padding:8px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;font-size:12.5px;}
  .mini-item .mi-top{display:flex;justify-content:space-between;gap:10px;}
  .mini-item .mi-sub{color:var(--muted);font-size:11.5px;margin-top:2px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .bar-row .bl{width:118px;flex-shrink:0;color:#b6c8e0;font-weight:600;}
  .bar-track{flex:1;background:rgba(255,255,255,.06);border-radius:6px;height:20px;overflow:hidden;}
  /* No min-width: at zero the bar should be empty, not a sliver that reads
     as 'a little'. The figure is printed beside it either way. */
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#0ea5e9,#7dd3fc);
    box-shadow:0 0 14px rgba(56,189,248,.35);}
  .bar-row .bv{width:92px;text-align:right;flex-shrink:0;color:var(--muted);font-weight:600;}

  .empty{text-align:center;padding:48px 20px;color:var(--muted);}
  .empty .big{font-size:34px;margin-bottom:10px;}
  .welcome{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);padding:40px 32px;text-align:center;}
  .welcome h2{font-size:20px;margin-bottom:8px;}
  .welcome p{color:var(--muted);max-width:480px;margin:0 auto 20px;}
  .welcome .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .train-progress{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);padding:18px 20px;margin-bottom:20px;}
  .prog-track{background:rgba(255,255,255,.06);border-radius:8px;height:14px;overflow:hidden;margin-top:8px;}
  .prog-fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#7dd3fc);border-radius:8px;transition:.3s;
    box-shadow:0 0 16px rgba(56,189,248,.4);}
  .module{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);margin-bottom:13px;overflow:hidden;}
  .module-head{padding:15px 18px;cursor:pointer;display:flex;align-items:center;gap:13px;}
  .module-head:hover{background:rgba(56,189,248,.06);}
  .module-num{width:34px;height:34px;border-radius:9px;background:rgba(56,189,248,.16);color:#7dd3fc;
    display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .module-head .mh-title{flex:1;font-weight:700;font-size:14.5px;}
  .module-head .mh-meta{font-size:12px;color:var(--muted);}
  .module-head .chev{color:var(--muted);transition:.2s;}
  .module.open .chev{transform:rotate(90deg);}
  .lessons{display:none;border-top:1px solid var(--border);}
  .module.open .lessons{display:block;}
  .lesson{padding:14px 18px 14px 20px;border-bottom:1px solid var(--border);display:flex;gap:13px;}
  .lesson:last-child{border-bottom:none;}
  .lesson .lcheck input{width:18px;height:18px;cursor:pointer;margin-top:2px;}
  .lesson-body{flex:1;}
  .lesson-body .lt{font-weight:600;font-size:13.5px;margin-bottom:4px;}
  .lesson-body .lt.done{text-decoration:line-through;color:var(--muted);}
  .lesson-body .lc{font-size:13px;color:#c3d3e8;}
  .lesson-body .lk{font-size:12.5px;color:#9fd8f7;background:rgba(56,189,248,.10);
    border-left:3px solid var(--primary);padding:7px 11px;border-radius:0 6px 6px 0;margin-top:8px;}
  .note-box{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);padding:18px 20px;margin-top:20px;}
  .note-box h3{font-size:15px;margin-bottom:10px;}
  .note-box textarea{min-height:120px;resize:vertical;}
  .save-hint{font-size:12px;color:var(--green);margin-top:8px;display:none;}

  .row-actions{display:flex;gap:2px;justify-content:flex-end;}
  /* The landing-page bars carry a path on one side and three figures on the
     other. At full width they sit side by side; on a phone there is not room
     for both plus a bar, so the row becomes two lines instead of overflowing. */
  .seo-path{width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .seo-val{width:186px;font-size:12px;}
  @media(max-width:700px){
    .bar-row:has(.seo-path){flex-wrap:wrap;}
    .seo-path{width:100%;}
    .seo-val{width:auto;margin-left:auto;text-align:right;}
    .bar-row:has(.seo-path) .bar-track{flex:1 1 55%;min-width:0;}
  }
  @media(max-width:840px){
    .panel-grid{grid-template-columns:1fr;}
    .sidebar{width:64px;}
    .logo span.txt,.nav a span.txt,.nav .label-sm,.user-box .em span.txt{display:none;}
    .main{margin-left:64px;width:calc(100% - 64px);padding:20px 14px 50px;}

    /* Everything below fixes a 64px rail that was being asked to hold
       full-width labelled buttons. */
    .logo{padding:14px 0;justify-content:center;}
    .nav{padding:10px 6px;}
    .nav a{justify-content:center;padding:11px 0;}
    .nav a .ico{width:auto;font-size:17px;}
    /* The unread count was landing outside the rail entirely. */
    .nav a{position:relative;}
    .nav a .pill{position:absolute;top:3px;right:6px;margin:0;padding:0 5px;font-size:9px;line-height:15px;}
    .user-box{padding:8px 6px;}
    .user-box .em{justify-content:center;margin-bottom:6px;}
    /* Icon only. The words did not fit and were wrapping over the edge. */
    .user-box button{font-size:0;padding:9px 0;min-height:38px;}
    .user-box button::first-letter{font-size:15px;}

    /* Two figures side by side reads far better than one tall column. */
    .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .stat{padding:13px 14px;}
    .stat .value{font-size:22px;}
    .stat .label{font-size:10.5px;letter-spacing:.4px;}
    .view-head h1{font-size:20px;}
  }
</style>
</head>
<body>

<div class="splash" id="splash"><div class="spinner"></div><div>Starting Ridgeline…</div></div>

<div class="auth-wrap" id="authScreen">

<div class="app" id="appRoot" style="display:none">
  <aside class="sidebar">

    <nav class="nav" id="nav"></nav>

      <div class="em"><span class="dot"></span><span class="txt" id="userEmail"></span></div>
      <button onclick="refreshData()">↻ Refresh from cloud</button>
      <button onclick="exportData()">⬇ Export backup</button>
      <button onclick="signOut()">⎋ Sign out</button>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="loading" id="loadingOverlay"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ====================================================================
   RIDGELINE — AI-first CRM for roofing & exterior contractors
   The publishable key below is safe in client code; data is protected
   by Row Level Security policies on the database.
   ==================================================================== */
const SUPABASE_URL = 'https://ydfgllpozihgjuoxulrf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DnZ8wsW76lp_djiPQp1Xgw_20eS_cNW';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================ CONSTANTS ============================ */
const STAGES = ['New Lead','Contacted','Inspection Scheduled','Quote Sent','Won','Build','Completed','Lost'];
const STAGE_COLOR = {'New Lead':'#64748b','Contacted':'#0ea5e9','Inspection Scheduled':'#6366f1',
  'Quote Sent':'#a855f7','Won':'#16a34a','Build':'#ea580c','Completed':'#0d9488','Lost':'#dc2626'};
const SERVICE_TYPES = ['Full Roof Replacement','Roof Repair','Roof Inspection','Gutters','Siding','Other'];
const LEAD_SOURCES = ['Storm / Door-knock','Referral','Google','Facebook','Yard Sign',
  'Insurance','Repeat Customer','Other'];
const CONTACT_STATUS = ['New','Working','Nurturing','Active','At Risk','Past Customer'];
const ACT_ICON = {Call:'📞',Meeting:'🤝',Email:'✉️',Note:'📝'};
const DEFAULT_TEMPLATE = 'Hi {first_name}, this is {business_name} — thank you for trusting us with '
  +'your {service_type}. If you have a moment, a quick Google review would really help our small '
  +'business: {link}. Thank you!';

let state = {contacts:[],deals:[],activities:[],reminders:[],calls:[],review_requests:[],roof_measurements:[],job_photos:[],settings:null,training:{progress:{},notes:''},members:[],invitations:[],notifications:[]};
let currentView = 'dashboard';
let currentJobId = null;
let currentUser = null;
let currentCompany = null;
let currentMembership = null;
let appLoaded = false;
let authMode = 'login';
let isPlatformAdmin = false;   // the operator tier, above every company
let platformData = null;
let platformDays = 30;

/* ============================ HELPERS ============================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function money(n){return '$'+Number(n||0).toLocaleString('en-US');}
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtDate(s){if(!s)return '—';const p=String(s).slice(0,10).split('-');
  if(p.length!==3)return s;
  const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[+p[1]-1]+' '+(+p[2])+', '+p[0];}
function contact(id){return state.contacts.find(c=>c.id===id);}
function contactName(id){const c=contact(id);return c?c.name:'—';}
function daysUntil(s){if(!s)return 9999;
  const d=new Date(String(s).slice(0,10)+'T00:00:00'),t=new Date(todayStr()+'T00:00:00');
  return Math.round((d-t)/86400000);}
function val(id){const e=document.getElementById(id);return e?(e.value||'').trim():'';}
function opts(arr,sel){return arr.map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');}
function showLoading(on){document.getElementById('loadingOverlay').classList.toggle('show',!!on);}

/* ============================ TEAM HELPERS ============================ */
function isAdmin(){return !!(currentMembership&&(currentMembership.role==='owner'||currentMembership.role==='admin'));}
function isOwner(){return !!(currentMembership&&currentMembership.role==='owner');}
function member(uid){return state.members.find(m=>m.user_id===uid)||null;}
function memberName(uid){const m=member(uid);return m?(m.display_name||m.email||'Teammate'):'Unassigned';}
function roleLabel(r){return ({owner:'Owner',admin:'Admin',rep:'Rep'})[r]||r;}

/* ============================ AUTH ============================ */
function setAuthMode(mode){
  authMode=mode;
  document.getElementById('tabLogin').classList.toggle('active',mode==='login');
  document.getElementById('tabSignup').classList.toggle('active',mode==='signup');
  document.getElementById('authBtn').textContent=mode==='login'?'Log in':'Create account';
  document.getElementById('authSub').textContent=mode==='login'
    ?'Sign in to your roofing workspace.'
    :'Sign-ups are restricted — use an approved or invited email address.';
  document.getElementById('authErr').textContent='';
  document.getElementById('authMsg').textContent='';
  document.getElementById('authPass').setAttribute('autocomplete',
    mode==='login'?'current-password':'new-password');
}
function friendlyAuthError(e){
  const m=(e&&e.message||'').toLowerCase();
  if(m.includes('invalid login'))return 'Wrong email or password.';
  if(m.includes('email not confirmed'))return 'Please confirm your email first — check your inbox for the link.';
  if(m.includes('already registered')||m.includes('already been registered'))
    return 'That email already has an account. Switch to "Log in".';
  if(m.includes('not approved')||m.includes('email_not_allowed')
    ||m.includes('database error saving new user'))
    return 'This email is not approved. Ask your administrator to approve it, or have a teammate invite you.';
  if(m.includes('password'))return e.message;
  if(m.includes('rate limit'))return 'Too many attempts. Please wait a moment and try again.';
  return e.message||'Something went wrong. Please try again.';
}
async function submitAuth(){
  const email=val('authEmail');
  const pass=document.getElementById('authPass').value;
  const errEl=document.getElementById('authErr');
  const msgEl=document.getElementById('authMsg');
  const btn=document.getElementById('authBtn');
  errEl.textContent='';msgEl.textContent='';
  if(!email||!pass){errEl.textContent='Enter your email and password.';return;}
  if(pass.length<6){errEl.textContent='Password must be at least 6 characters.';return;}
  btn.disabled=true;btn.textContent=authMode==='login'?'Logging in…':'Creating account…';
  try{
    if(authMode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pass});
      if(error)throw error;
      if(!data.session){
        setAuthMode('login');
        document.getElementById('authMsg').textContent=
          'Account created. Check '+email+' for a confirmation link, then log in.';
      }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
  }catch(e){
    errEl.textContent=friendlyAuthError(e);
  }finally{
    btn.disabled=false;
    btn.textContent=authMode==='login'?'Log in':'Create account';
  }
}
async function signOut(){ await sb.auth.signOut(); }
function showAuth(){
  document.getElementById('splash').style.display='none';
  document.getElementById('appRoot').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}
function showOnboard(){
  document.getElementById('splash').style.display='none';
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appRoot').style.display='none';
  document.getElementById('onboardScreen').style.display='flex';
}
async function enterApp(){
  document.getElementById('splash').style.display='none';
  document.getElementById('authScreen').style.display='none';
  showLoading(true);
  // Resolve which company this user belongs to (joining a pending invite if any).
  let companyId=null;
  try{
    const {data,error}=await sb.rpc('ensure_membership');
    if(error)throw error;
    companyId=data;
  }catch(e){
    showLoading(false);
    alert('Could not set up your account: '+(e.message||e));
    return;
  }
  if(!companyId){ showLoading(false); showOnboard(); return; }
  document.getElementById('onboardScreen').style.display='none';
  document.getElementById('appRoot').style.display='flex';
  document.getElementById('userEmail').textContent=currentUser.email;
  try{ await loadCompany(); await loadAll(); }
  catch(e){ alert('Could not load your data: '+(e.message||e)); }
  // Cosmetic only: the database refuses platform data to everyone else
  // regardless of what this flag says.
  try{
    const { data } = await sb.rpc('is_platform_admin');
    isPlatformAdmin = data === true;
  }catch(e){ isPlatformAdmin = false; }
  showLoading(false);
  buildNav();
  render();
}
async function submitOnboard(){
  const name=val('onboardName');
  const errEl=document.getElementById('onboardErr');
  const btn=document.getElementById('onboardBtn');
  errEl.textContent='';
  if(!name){errEl.textContent='Please enter a company name.';return;}
  btn.disabled=true;btn.textContent='Creating…';
  try{
    const {error}=await sb.rpc('create_company',{p_name:name});
    if(error)throw error;
    await enterApp();
  }catch(e){
    errEl.textContent=e.message||'Could not create your workspace.';
  }finally{
    btn.disabled=false;btn.textContent='Create my workspace';
  }
}
async function loadCompany(){
  const [co,mem]=await Promise.all([
    sb.from('companies').select('*').maybeSingle(),
    sb.from('company_members').select('*').order('created_at',{ascending:true}),
  ]);
  if(co.error)throw co.error;
  if(mem.error)throw mem.error;
  currentCompany=co.data||null;
  state.members=mem.data||[];
  currentMembership=state.members.find(m=>m.user_id===currentUser.id)||null;
}

/* ============================ DATA LAYER ============================ */
async function loadAll(){
  const [c,d,a,r,k,rq,rm,ph,g,t,nt,iv]=await Promise.all([
    sb.from('contacts').select('*').order('created_at',{ascending:true}),
    sb.from('deals').select('*').order('created_at',{ascending:true}),
    sb.from('activities').select('*').order('date',{ascending:false}),
    sb.from('reminders').select('*').order('due_date',{ascending:true}),
    sb.from('calls').select('*').order('occurred_at',{ascending:false}),
    sb.from('review_requests').select('*').order('created_at',{ascending:false}),
    sb.from('roof_measurements').select('*'),
    sb.from('job_photos').select('*'),
    sb.from('account_settings').select('*').maybeSingle(),
    sb.from('training').select('*').eq('user_id',currentUser.id).maybeSingle(),
    sb.from('notifications').select('*').order('created_at',{ascending:false}),
    sb.from('invitations').select('*').eq('status','pending').order('created_at',{ascending:false}),
  ]);
  for(const res of [c,d,a,r,k,rq,rm,ph,g,t,nt,iv]){if(res.error)throw res.error;}
  state.contacts=c.data||[];
  state.deals=d.data||[];
  state.activities=a.data||[];
  state.reminders=r.data||[];
  state.calls=k.data||[];
  state.review_requests=rq.data||[];
  state.roof_measurements=rm.data||[];
  state.job_photos=ph.data||[];
  state.settings=g.data||null;
  state.training=t.data?{progress:t.data.progress||{},notes:t.data.notes||''}:{progress:{},notes:''};
  state.notifications=nt.data||[];
  state.invitations=iv.data||[];
  await reconcileNotifications();
}
async function dbInsert(table,row){
  const {data,error}=await sb.from(table).insert(row).select().single();
  if(error)throw error;
  return data;
}
async function dbUpdate(table,id,patch){
  const {data,error}=await sb.from(table).update(patch).eq('id',id).select().single();
  if(error)throw error;
  return data;
}
async function dbDelete(table,id){
  const {error}=await sb.from(table).delete().eq('id',id);
  if(error)throw error;
}
async function refreshData(){
  showLoading(true);
  try{await loadAll();}catch(e){alert('Refresh failed: '+(e.message||e));}
  showLoading(false);
  render();
}

/* ============================ NAV ============================ */
const NAV=[
  {sec:'Workspace'},
  {id:'dashboard',ico:'◫',label:'Dashboard'},
  {id:'contacts',ico:'☰',label:'Contacts'},
  {id:'pipeline',ico:'▥',label:'Job Pipeline'},
  {id:'calls',ico:'📞',label:'Calls & Messages'},
  {id:'activities',ico:'✦',label:'Activity Log'},
  {id:'reminders',ico:'◷',label:'Follow-ups'},
  {id:'reviews',ico:'⭐',label:'Reviews'},
  {id:'inbox',ico:'🔔',label:'Notifications'},
  {sec:'Develop'},
  {id:'training',ico:'★',label:'Sales Training'},
  {sec:'Account'},
  {id:'team',ico:'👥',label:'Team'},
  {id:'settings',ico:'⚙',label:'Settings'},
];
// Appended at render time, only for the operator.
const PLATFORM_NAV=[
  {sec:'Platform'},
  {id:'seo',ico:'◈',label:'SEO Command'},
];
function buildNav(){
  const missed=state.calls.filter(c=>c.status==='missed').length;
  const unread=state.notifications.filter(n=>!n.read&&currentUser&&n.user_id===currentUser.id).length;
  const items = isPlatformAdmin ? NAV.concat(PLATFORM_NAV) : NAV;
  document.getElementById('nav').innerHTML=items.map(n=>{
    if(n.sec)return `<div class="label-sm">${n.sec}</div>`;
    let pill='';
    if(n.id==='calls'&&missed)pill=`<span class="pill">${missed}</span>`;
    if(n.id==='inbox'&&unread)pill=`<span class="pill">${unread}</span>`;
    return `<a class="${n.id===currentView?'active':''}" onclick="go('${n.id}')">
      <span class="ico">${n.ico}</span><span class="txt">${n.label}</span>${pill}</a>`;
  }).join('');
}
function go(view){currentView=view;buildNav();render();window.scrollTo(0,0);}
function render(){
  const v=document.getElementById('view');
  if(currentView==='dashboard')v.innerHTML=viewDashboard();
  else if(currentView==='jobspace')v.innerHTML=viewJobWorkspace();
  else if(currentView==='contacts')v.innerHTML=viewContacts();
  else if(currentView==='pipeline'){v.innerHTML=viewPipeline();wireKanban();}
  else if(currentView==='calls')v.innerHTML=viewCalls();
  else if(currentView==='activities')v.innerHTML=viewActivities();
  else if(currentView==='reminders')v.innerHTML=viewReminders();
  else if(currentView==='reviews')v.innerHTML=viewReviews();
  else if(currentView==='inbox')v.innerHTML=viewInbox();
  else if(currentView==='team')v.innerHTML=viewTeam();
  else if(currentView==='training')v.innerHTML=viewTraining();
  else if(currentView==='settings')v.innerHTML=viewSettings();
  else if(currentView==='seo')viewPlatformSEO();
}

/* ============================ DASHBOARD ============================ */
function viewDashboard(){
  const cs=state.contacts;
  const isEmpty=!cs.length&&!state.deals.length&&!state.activities.length
    &&!state.reminders.length&&!state.calls.length;
  if(isEmpty){
    return `<div class="view-head"><div><h1>Welcome to Ridgeline</h1>
      <p>Your roofing workspace is ready.</p></div></div>
      <div class="welcome">
        <div style="font-size:40px;margin-bottom:8px">🏠</div>
        <h2>Let's get your jobs flowing</h2>
        <p>Add your first contact, or load sample data to see how the dashboard, job pipeline,
        and call log work for a roofing business. Everything you enter is saved securely to your account.</p>
        <div class="actions">
          <button class="btn" onclick="openContactForm()">+ Add your first contact</button>
          <button class="btn secondary" onclick="loadSample()">Load sample data</button>
        </div>
      </div>`;
  }
  const leads=cs.filter(c=>c.type==='Lead').length;
  const customers=cs.filter(c=>c.type==='Customer').length;
  const openDeals=state.deals.filter(d=>d.stage!=='Won'&&d.stage!=='Build'&&d.stage!=='Completed'&&d.stage!=='Lost');
  const pipeVal=openDeals.reduce((s,d)=>s+Number(d.value||0),0);
  const wonVal=state.deals.filter(d=>d.stage==='Won'||d.stage==='Build'||d.stage==='Completed').reduce((s,d)=>s+Number(d.value||0),0);
  const overdue=state.reminders.filter(r=>!r.done&&daysUntil(r.due_date)<0).length;
  const openRem=state.reminders.filter(r=>!r.done).length;
  const missed=state.calls.filter(c=>c.status==='missed').length;
  const byStage=STAGES.map(st=>{
    const ds=state.deals.filter(d=>d.stage===st);
    return {st,count:ds.length,val:ds.reduce((s,d)=>s+Number(d.value||0),0)};
  });
  const maxVal=Math.max(1,...byStage.map(b=>b.val));
  const upcoming=state.reminders.filter(r=>!r.done)
    .sort((a,b)=>(a.due_date||'').localeCompare(b.due_date||'')).slice(0,5);
  const recentCalls=[...state.calls]
    .sort((a,b)=>(b.occurred_at||'').localeCompare(a.occurred_at||'')).slice(0,5);
  const needsAttention=state.deals.filter(d=>d.stage==='Won'&&!buildReady(d));
  return `
  <div class="view-head">
    <div><h1>Dashboard</h1><p>Your roofing snapshot for ${fmtDate(todayStr())}</p></div>
    <button class="btn" onclick="openContactForm()">+ New Contact</button>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="label">Contacts</div><div class="value blue">${cs.length}</div>
      <div class="sub">${leads} leads · ${customers} customers</div></div>
    <div class="stat"><div class="label">Open Jobs</div><div class="value">${openDeals.length}</div>
      <div class="sub">in the pipeline</div></div>
    <div class="stat"><div class="label">Pipeline Value</div><div class="value blue">${money(pipeVal)}</div>
      <div class="sub">potential revenue</div></div>
    <div class="stat"><div class="label">Won Revenue</div><div class="value green">${money(wonVal)}</div>
      <div class="sub">jobs landed</div></div>
    <div class="stat"><div class="label">Missed Calls</div>
      <div class="value ${missed?'red':''}">${missed}</div>
      <div class="sub">${missed?'need a call back':'all caught up'}</div></div>
    <div class="stat"><div class="label">Open Follow-ups</div><div class="value amber">${openRem}</div>
      <div class="sub">${overdue} overdue</div></div>
  </div>
  <div class="panel-grid">
    <div class="panel" style="grid-column:1/-1">
      <h3>Back-Office Check — Sold Jobs Awaiting Build <span class="count">${needsAttention.length}</span></h3>
      ${needsAttention.length?needsAttention.map(d=>`<div class="mini-item" style="cursor:pointer" onclick="openJobWorkspace('${d.id}')">
        <div class="mi-top"><span>${esc(d.title)}</span><span class="badge b-red">incomplete</span></div>
        <div class="mi-sub">${esc(contactName(d.contact_id))} · still needs: ${esc(missingItems(d).join(', '))}</div></div>`).join('')
        :`<div class="empty"><div class="big">✓</div>Every sold job is build-ready.</div>`}
    </div>
    <div class="panel">
      <h3>Pipeline by Stage</h3>
      ${byStage.map(b=>`
        <div class="bar-row">
          <div class="bl">${b.st}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${b.val/maxVal*100}%;
            background:${STAGE_COLOR[b.st]}"></div></div>
          <div class="bv">${b.count} · ${money(b.val)}</div>
        </div>`).join('')}
    </div>
    <div class="panel">
      <h3>Upcoming Follow-ups <span class="count">${upcoming.length}</span></h3>
      ${upcoming.length?upcoming.map(r=>{
        const du=daysUntil(r.due_date);

function dealCard(d){
  return `<div class="deal" draggable="true" data-id="${d.id}">
    <div class="dt" style="cursor:pointer;color:var(--primary)" title="Open job workspace"
      onclick="openJobWorkspace('${d.id}')">${esc(d.title)}</div>
    <div class="dc">${esc(contactName(d.contact_id))}</div>
    ${d.service_type?`<div class="dmini">${esc(d.service_type)}${d.insurance_claim?' · Insurance':''}</div>`:''}

    ${d.stage==='Completed'?reviewCardAction(d):''}
    <div class="dmeta">
      <small>Close ${fmtDate(d.expected_close)}</small>
      <span>
        <button class="icon-btn" title="Material order" onclick="openMaterialOrder('${d.id}')">📐</button>
        <button class="icon-btn" title="Edit" onclick="openDealForm('${d.id}')">✎</button>

      </span>

let dragId=null;
function wireKanban(){
  document.querySelectorAll('.deal').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.id;e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',()=>{dragId=null;
      document.querySelectorAll('.col').forEach(c=>c.classList.remove('drag-over'));});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',async e=>{
      e.preventDefault();col.classList.remove('drag-over');
      if(!dragId)return;
      const d=state.deals.find(x=>x.id===dragId),newStage=col.dataset.stage;
      if(d&&d.stage!==newStage){
        if(newStage==='Build'&&!buildReady(d)){
          alert('This job is not ready for Build.\n\nThe back-office check still needs: '+missingItems(d).join(', ')+'.');
          return;
        }
        const prev=d.stage;d.stage=newStage;render();wireKanban();
        const patch={stage:newStage};
        if(newStage==='Completed'&&!d.completed_at)patch.completed_at=todayStr();
        try{const row=await dbUpdate('deals',d.id,patch);Object.assign(d,row);}
        catch(e){d.stage=prev;render();wireKanban();alert('Could not move job: '+(e.message||e));}
      }
    });
  });
}

async function deleteContact(id){
  const c=contact(id);if(!c)return;
  if(!confirm(`Delete ${c.name}? This also removes their jobs, activities, and follow-ups.`))return;
  showLoading(true);
  try{
    await sb.from('activities').delete().eq('contact_id',id);
    // Photos live in storage, not in a table, so deleting the deal row is not
    // enough -- the image files have to go first or they are orphaned there.
    const goneDeals=state.deals.filter(d=>d.contact_id===id).map(d=>d.id);
    const gonePaths=state.job_photos.filter(p=>goneDeals.indexOf(p.deal_id)>=0)
      .map(p=>p.storage_path);
    if(gonePaths.length){try{await sb.storage.from('job-photos').remove(gonePaths);}catch(_e){}}
    await sb.from('deals').delete().eq('contact_id',id);
    await sb.from('reminders').delete().eq('contact_id',id);
    await dbDelete('contacts',id);
    state.activities=state.activities.filter(x=>x.contact_id!==id);
    state.deals=state.deals.filter(x=>x.contact_id!==id);
    state.reminders=state.reminders.filter(x=>x.contact_id!==id);
    state.job_photos=state.job_photos.filter(p=>goneDeals.indexOf(p.deal_id)<0);
    state.roof_measurements=state.roof_measurements.filter(m=>goneDeals.indexOf(m.deal_id)<0);
    state.calls.forEach(k=>{if(k.contact_id===id)k.contact_id=null;});
    state.contacts=state.contacts.filter(x=>x.id!==id);

async function saveDeal(id){
  const title=val('d_title');
  if(!title){alert('Please enter a job name.');return;}
  const stage=val('d_stage');
  const data={title,contact_id:val('d_contact')||null,
    job_address:val('d_address'),service_type:val('d_service'),
    insurance_claim:val('d_ins')==='Yes',
    value:Number(document.getElementById('d_value').value||0),
    stage,expected_close:val('d_close')||null,
    completed_at:val('d_completed')||(stage==='Completed'?todayStr():null),
    assigned_to:val('d_assigned')||currentUser.id,
    ai_next_action:val('d_next'),notes:val('d_notes')};
  const btn=document.getElementById('saveBtn');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  if(stage==='Build'){
    const dd=id?state.deals.find(x=>x.id===id):null;
    if(!dd||!buildReady(dd)){
      alert('This job can\'t move to Build yet.\n\nThe back-office check still needs: '
        +(dd?missingItems(dd).join(', '):'inspection, photos, measurement, a signed estimate, material selections')+'.');
      if(btn){btn.disabled=false;btn.textContent=id?'Save Changes':'Add Job';}
      return;
    }
  }
  try{
    if(id){const row=await dbUpdate('deals',id,data);
      const i=state.deals.findIndex(x=>x.id===id);if(i>=0)state.deals[i]=row;}
    else{const row=await dbInsert('deals',data);state.deals.push(row);}
    closeModal();render();if(currentView==='pipeline')wireKanban();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent=id?'Save Changes':'Add Job';}
    alert('Could not save job: '+(e.message||e));
  }
}
async function deleteDeal(id){
  if(!confirm('Delete this job?'))return;
  try{
    const photoPaths=state.job_photos.filter(p=>p.deal_id===id).map(p=>p.storage_path);
    if(photoPaths.length){try{await sb.storage.from('job-photos').remove(photoPaths);}catch(_e){}}
    await dbDelete('deals',id);
    state.deals=state.deals.filter(x=>x.id!==id);
    state.roof_measurements=state.roof_measurements.filter(x=>x.deal_id!==id);
    state.job_photos=state.job_photos.filter(x=>x.deal_id!==id);
    closeModal();render();if(currentView==='pipeline')wireKanban();
  }catch(e){alert('Could not delete: '+(e.message||e));}
}

function trainStats(){
  let total=0,done=0;
  TRAINING.forEach((m,mi)=>m.lessons.forEach((l,li)=>{
    total++;if(state.training.progress[mi+'-'+li])done++;
  }));
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function firstIncompleteModule(){
  for(let mi=0;mi<TRAINING.length;mi++){
    if(!TRAINING[mi].lessons.every((l,li)=>state.training.progress[mi+'-'+li]))return mi;
  }
  return 0;
}
function viewTraining(){
  const s=trainStats();

    </div>
    <div class="prog-track"><div class="prog-fill" style="width:${s.pct}%"></div></div>
  </div>
  ${TRAINING.map((m,mi)=>{
    const ld=m.lessons.filter((l,li)=>state.training.progress[mi+'-'+li]).length;
    return `<div class="module ${mi===firstIncompleteModule()&&ld<m.lessons.length?'open':''}" id="mod${mi}">
      <div class="module-head" onclick="toggleModule(${mi})">
        <div class="module-num">${mi+1}</div>
        <div class="mh-title">${esc(m.title)}
          <div class="mh-meta">${ld}/${m.lessons.length} lessons complete</div></div>
        <div class="chev">▸</div>
      </div>
      <div class="lessons">${m.lessons.map((l,li)=>{
        const dn=!!state.training.progress[mi+'-'+li];
        return `<div class="lesson">
          <div class="lcheck"><input type="checkbox" ${dn?'checked':''}
            onchange="toggleLesson(${mi},${li})"></div>
          <div class="lesson-body">
            <div class="lt ${dn?'done':''}">${esc(l.t)}</div>
            <div class="lc">${esc(l.c)}</div>

function toggleModule(mi){document.getElementById('mod'+mi).classList.toggle('open');}
function toggleLesson(mi,li){
  const key=mi+'-'+li;
  if(state.training.progress[key])delete state.training.progress[key];
  else state.training.progress[key]=true;
  const openIds=[...document.querySelectorAll('.module.open')].map(e=>e.id);
  document.getElementById('view').innerHTML=viewTraining();
  openIds.forEach(id=>{const e=document.getElementById(id);if(e)e.classList.add('open');});

}
async function saveTraining(){
  try{

      user_id:currentUser.id,progress:state.training.progress,
      notes:state.training.notes||'',updated_at:new Date().toISOString()
    });

/* ======================== REVIEW REQUESTS ======================== */
function reviewMessageFor(c,d){
  const s=state.settings||{};
  const tmpl=s.request_template||DEFAULT_TEMPLATE;
  const first=((c.name||'there').trim().split(/\s+/)[0])||'there';
  const svc=(d&&d.service_type?d.service_type:'roofing project').toLowerCase();
  return tmpl
    .replace(/\{first_name\}/g,first)
    .replace(/\{business_name\}/g,s.business_name||'our team')
    .replace(/\{service_type\}/g,svc)
    .replace(/\{link\}/g,s.review_link||'');
}
function reviewCardAction(d){
  if(!d.contact_id)return '';
  const reqs=state.review_requests.filter(r=>r.deal_id===d.id);
  if(reqs.some(r=>r.status==='completed'))
    return `<div class="rev-done">★ Review received</div>`;
  if(reqs.length)
    return `<div class="rev-done">★ Review requested</div>`;
  return `<button class="btn sm" style="width:100%;margin-top:8px"
    onclick="openReviewRequest('${d.contact_id}','${d.id}')">★ Request a review</button>`;
}
function openReviewRequest(contactId,dealId){
  const c=contact(contactId);
  if(!c){alert('Contact not found.');return;}
  const s=state.settings||{};
  if(!s.review_link){
    alert('First add your Google Place ID in Settings — that generates your review link.');
    closeModal();go('settings');return;
  }
  if(!c.phone){alert('This contact has no phone number. Add one first, then request a review.');return;}
  const d=dealId?state.deals.find(x=>x.id===dealId):null;
  const msg=reviewMessageFor(c,d);
  openModal(`
  <div class="modal-head"><h2>Request a Review</h2>
    <button class="icon-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="detail-grid" style="margin-bottom:14px">
      <div><div class="dl">Customer</div><div class="dv">${esc(c.name)}</div></div>
      <div><div class="dl">Phone</div><div class="dv">${esc(c.phone)}</div></div>
    </div>
    <div class="field"><label>Message — edit if you like</label>
      <textarea id="rr_msg" rows="5">${esc(msg)}</textarea></div>
    <div style="font-size:11.5px;color:var(--muted)">Your Google review link is already in the message.
      On a phone, "Text the customer" opens your Messages app with this text ready to send.</div>
  </div>
  <div class="modal-foot">
    <button class="btn secondary" onclick="copyReviewMsg()">Copy message</button>
    <button class="btn" onclick="sendReviewText('${contactId}','${dealId||''}')">Text the customer</button>
  </div>`);
}
function copyReviewMsg(){
  const t=document.getElementById('rr_msg');
  if(!t)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value)
      .then(()=>alert('Message copied — paste it into a text to your customer.'))
      .catch(()=>{t.focus();t.select();});
  }else{t.focus();t.select();}
}
async function sendReviewText(contactId,dealId){
  const c=contact(contactId);if(!c)return;
  const s=state.settings||{};
  const msg=(document.getElementById('rr_msg')||{}).value||'';
  const num=(c.phone||'').replace(/[^\d+]/g,'');
  try{
    const row=await dbInsert('review_requests',{
      contact_id:contactId,deal_id:dealId||null,status:'sent',
      sent_at:new Date().toISOString(),message:msg,review_link:s.review_link||null
    });
    state.review_requests.unshift(row);
  }catch(e){alert('Could not log the review request: '+(e.message||e));return;}
  closeModal();render();
  const a=document.createElement('a');
  a.href='sms:'+num+'?body='+encodeURIComponent(msg);
  a.click();
}

/* ======================== ESTIMATES ======================== */
let estDraft={items:[],markup_pct:0,tax_pct:0,notes:'',terms:''};
let estDealId=null;
function computeEstimate(est){
  const items=(est&&est.items)||[];
  const markup=Number(est&&est.markup_pct||0)/100;
  const taxr=Number(est&&est.tax_pct||0)/100;
  const baseSum=items.reduce((s,it)=>s+Number(it.qty||0)*Number(it.unit_price||0),0);
  const subtotal=baseSum*(1+markup);
  const tax=subtotal*taxr;
  return {baseSum,markupAmt:subtotal-baseSum,subtotal,tax,total:subtotal+tax};
}
function estimateTotal(est){return computeEstimate(est).total;}
function openEstimateBuilder(dealId){
  const d=state.deals.find(x=>x.id===dealId);
  if(!d){alert('Job not found.');return;}
  estDealId=dealId;
  const e=d.estimate;
  estDraft=e?{items:(e.items||[]).map(x=>({...x})),markup_pct:e.markup_pct||0,
    tax_pct:e.tax_pct||0,notes:e.notes||'',terms:e.terms||''}
   :{items:[],markup_pct:0,tax_pct:0,notes:'',terms:''};
  openModal(`
  <div class="modal-head"><h2>Estimate — ${esc(d.title)}</h2>
    <button class="icon-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px">
      <span style="font-size:12px;color:var(--muted)">Build the quote line by line. Markup is folded into the prices the customer sees.</span>
      <button class="btn sm secondary" style="white-space:nowrap" onclick="importFromMaterialOrder()">Import material order</button>
    </div>
    <div class="table-wrap"><table><thead><tr>
      <th>Description</th><th style="width:92px">Category</th><th style="width:58px">Qty</th>
      <th style="width:88px">Unit $</th><th style="width:82px">Total</th><th style="width:28px"></th>
    </tr></thead><tbody id="est_rows"></tbody></table></div>
    <button class="btn sm secondary" style="margin-top:8px" onclick="addEstRow()">+ Add line</button>
    <div class="field-row" style="margin-top:16px">
      <div class="field"><label>Markup %</label>
        <input type="number" id="est_markup" min="0" value="${estDraft.markup_pct}"
          oninput="estDraft.markup_pct=Number(this.value||0);estRecalc()"></div>
      <div class="field"><label>Tax %</label>
        <input type="number" id="est_tax" min="0" step="0.01" value="${estDraft.tax_pct}"
          oninput="estDraft.tax_pct=Number(this.value||0);estRecalc()"></div>
    </div>
    <div id="est_summary" style="background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:6px 0 14px"></div>
    <div class="field"><label>Notes for the customer</label>
      <textarea id="est_notes" rows="2">${esc(estDraft.notes)}</textarea></div>
    <div class="field"><label>Terms</label>
      <textarea id="est_terms" rows="2">${esc(estDraft.terms)}</textarea></div>
  </div>
  <div class="modal-foot">
    <button class="btn secondary" onclick="closeModal()">Cancel</button>
    <button class="btn" id="estSaveBtn" onclick="saveEstimate()">Save Estimate</button>
  </div>`,true);
  renderEstimateRows();estRecalc();
}
function renderEstimateRows(){
  const tb=document.getElementById('est_rows');
  if(!tb)return;
  if(!estDraft.items.length){
    tb.innerHTML='<tr><td colspan="6" style="color:var(--muted);font-size:12.5px;padding:12px">No line items yet — add one, or import the material order.</td></tr>';
    return;
  }
  tb.innerHTML=estDraft.items.map((it,i)=>`<tr>
    <td><input type="text" value="${esc(it.desc||'')}" oninput="estEdit(${i},'desc',this.value)"></td>
    <td><select onchange="estEdit(${i},'category',this.value)">${opts(['Materials','Labor','Other'],it.category||'Materials')}</select></td>
    <td><input type="number" min="0" value="${it.qty!=null?it.qty:''}" oninput="estEdit(${i},'qty',this.value)"></td>
    <td><input type="number" min="0" step="0.01" value="${it.unit_price!=null?it.unit_price:''}" oninput="estEdit(${i},'unit_price',this.value)"></td>
    <td><span id="est_lt_${i}">${money(Number(it.qty||0)*Number(it.unit_price||0))}</span></td>
    <td><button class="icon-btn" title="Remove" onclick="removeEstRow(${i})">✕</button></td>
  </tr>`).join('');
}
function estEdit(i,field,value){
  if(!estDraft.items[i])return;
  estDraft.items[i][field]=(field==='qty'||field==='unit_price')?Number(value||0):value;

/* ============================ REVIEWS ============================ */
let reviewFilter='All';
function reviewStatusBadge(s){
  const cls={scheduled:'b-gray',sent:'b-amber',followed_up:'b-amber',completed:'b-green',
    failed:'b-red',opted_out:'b-gray'};
  const lbl={scheduled:'Scheduled',sent:'Sent',followed_up:'Followed up',
    completed:'Review received',failed:'Failed',opted_out:'Opted out'};
  return `<span class="badge ${cls[s]||'b-gray'}">${lbl[s]||esc(s||'—')}</span>`;
}
function reviewVelocity(){
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now=new Date(),months=[];
  for(let i=5;i>=0;i--){
    const dt=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({key:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'),
      label:M[dt.getMonth()],count:0});
  }
  state.review_requests.forEach(r=>{
    if(!['sent','followed_up','completed'].includes(r.status))return;
    const d=r.sent_at||r.created_at;if(!d)return;
    const m=months.find(x=>x.key===String(d).slice(0,7));
    if(m)m.count++;
  });
  return months;
}
function viewReviews(){
  const all=[...state.review_requests];
  const sentish=all.filter(r=>['sent','followed_up','completed'].includes(r.status));
  const received=all.filter(r=>r.status==='completed').length;
  const scheduled=all.filter(r=>r.status==='scheduled').length;
  const failed=all.filter(r=>r.status==='failed').length;
  const conv=sentish.length?Math.round(received/sentish.length*100):0;
  const vel=reviewVelocity();
  const maxV=Math.max(1,...vel.map(m=>m.count));
  let list=all;
  if(reviewFilter==='Scheduled')list=all.filter(r=>r.status==='scheduled');
  else if(reviewFilter==='Sent')list=all.filter(r=>r.status==='sent'||r.status==='followed_up');
  else if(reviewFilter==='Received')list=all.filter(r=>r.status==='completed');
  else if(reviewFilter==='Failed')list=all.filter(r=>r.status==='failed');
  list=list.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  return `
  <div class="view-head">
    <div><h1>Reviews</h1><p>${sentish.length} requests sent · ${received} reviews received · ${conv}% conversion</p></div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="label">Requests Sent</div><div class="value blue">${sentish.length}</div>
      <div class="sub">texted to customers</div></div>
    <div class="stat"><div class="label">Reviews Received</div><div class="value green">${received}</div>
      <div class="sub">marked by you</div></div>
    <div class="stat"><div class="label">Conversion Rate</div><div class="value">${conv}%</div>
      <div class="sub">received ÷ sent</div></div>
    <div class="stat"><div class="label">Scheduled</div><div class="value amber">${scheduled}</div>
      <div class="sub">waiting to send</div></div>
    <div class="stat"><div class="label">Failed</div><div class="value ${failed?'red':''}">${failed}</div>
      <div class="sub">${failed?'need attention':'none'}</div></div>
  </div>
  <div class="panel" style="margin-bottom:22px">
    <h3>Requests Sent — Last 6 Months</h3>
    ${vel.map(m=>`<div class="bar-row">
      <div class="bl">${m.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${m.count/maxV*100}%"></div></div>
      <div class="bv">${m.count}</div></div>`).join('')}
  </div>
  <div class="toolbar">
    <select class="filter" onchange="reviewFilter=this.value;render()">
      ${['All','Scheduled','Sent','Received','Failed'].map(o=>`<option ${o===reviewFilter?'selected':''}>${o}</option>`).join('')}
    </select>
  </div>
  <div class="table-wrap">${list.length?`<table><thead><tr>
    <th>Customer</th><th>Job</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>
    ${list.map(r=>{
      const d=r.deal_id?state.deals.find(x=>x.id===r.deal_id):null;
      const dt=r.status==='scheduled'?('Scheduled '+fmtDate(r.scheduled_for)):fmtDate(r.sent_at||r.created_at);
      const canMark=(r.status==='sent'||r.status==='followed_up');
      return `<tr>
        <td>${r.contact_id?`<span class="name-link" onclick="openContactDetail('${r.contact_id}')">${esc(contactName(r.contact_id))}</span>`:'—'}</td>
        <td>${d?esc(d.title):'—'}</td>
        <td>${reviewStatusBadge(r.status)}</td>
        <td><span style="color:var(--muted);font-size:12.5px">${dt}</span></td>
        <td><div class="row-actions">
          ${canMark?`<button class="btn sm" onclick="markReviewReceived('${r.id}')">★ Mark received</button>`:''}
          <button class="icon-btn" onclick="deleteReviewRequest('${r.id}')">🗑</button>
        </div></td>
      </tr>`;
    }).join('')}</tbody></table>`:
    `<div class="empty"><div class="big">⭐</div>No review requests yet.<br>
      Mark a job Completed (the engine schedules one automatically), or use "Request a review" on a job or contact.</div>`}</div>`;
}
async function markReviewReceived(id){
  const r=state.review_requests.find(x=>x.id===id);
  if(!r)return;
  try{
    const row=await dbUpdate('review_requests',id,{status:'completed'});
    Object.assign(r,row);render();
  }catch(e){alert('Could not update: '+(e.message||e));}
}
async function deleteReviewRequest(id){
  if(!confirm('Delete this review request?'))return;
  try{
    await dbDelete('review_requests',id);
    state.review_requests=state.review_requests.filter(x=>x.id!==id);
    render();
  }catch(e){alert('Could not delete: '+(e.message||e));}
}

  if(!d||!d.estimate)return;
  const signing=!d.estimate.signed;
  const estimate={...d.estimate,signed:signing};
  // Signing is the moment the job's value stops being a guess. Without this
  // the pipeline reports one number and the signed quote says another.
  const patch=signing?{estimate,value:estimateTotal(estimate)}:{estimate};
  dbUpdate('deals',dealId,patch).then(row=>{
    const i=state.deals.findIndex(x=>x.id===dealId);if(i>=0)state.deals[i]=row;
    render();
  }).catch(e=>alert('Could not update: '+(e.message||e)));

const photoUrlCache={};
async function loadPhotoUrls(jobId){
  const need=state.job_photos.filter(p=>p.deal_id===jobId&&!photoUrlCache[p.id]);
  if(!need.length)return;
  try{
    const {data,error}=await sb.storage.from('job-photos')
      .createSignedUrls(need.map(p=>p.storage_path),28800);
    if(error)throw error;
    (data||[]).forEach((res,idx)=>{if(res&&res.signedUrl)photoUrlCache[need[idx].id]=res.signedUrl;});
  }catch(e){console.error('Photo URL load failed:',e);}
}
function photoGalleryHTML(d){
  const photos=state.job_photos.filter(p=>p.deal_id===d.id)
    .sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  return `<div class="photo-grid">
    ${photos.map(p=>{
      const url=photoUrlCache[p.id];
      return `<div class="photo-tile">

             :`<div class="photo-loading">Loading…</div>`}

      </div>`;
    }).join('')}

        onchange="uploadPhotos('${d.id}',this.files)">

async function uploadPhotos(dealId,fileList){
  const files=[...(fileList||[])].filter(f=>f.type&&f.type.startsWith('image/'));
  if(!files.length){alert('Please choose image files.');return;}
  showLoading(true);
  let ok=0;
  for(const f of files){
    const ext=((f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''))||'jpg';
    const path=currentUser.id+'/'+dealId+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
    try{
      const up=await sb.storage.from('job-photos').upload(path,f,{contentType:f.type});
      if(up.error)throw up.error;
      const row=await dbInsert('job_photos',{deal_id:dealId,storage_path:path,caption:f.name});
      state.job_photos.push(row);ok++;
    }catch(e){console.error('Upload failed:',e);}
  }
  await loadPhotoUrls(dealId);
  showLoading(false);
  if(ok<files.length)alert(ok?'Some photos could not be uploaded — please retry.':'Photos could not be uploaded. Check your connection and try again.');
  render();
}
async function deletePhoto(id){
  const p=state.job_photos.find(x=>x.id===id);
  if(!p||!confirm('Delete this photo?'))return;
  try{
    await sb.storage.from('job-photos').remove([p.storage_path]);
    await dbDelete('job_photos',id);
    state.job_photos=state.job_photos.filter(x=>x.id!==id);
    delete photoUrlCache[id];
    render();
  }catch(e){alert('Could not delete photo: '+(e.message||e));}
}

function measurementFor(dealId){
  return state.roof_measurements.find(m=>m.deal_id===dealId)||null;

function num(id){const e=document.getElementById(id);return e?Number(e.value||0):0;}
function wastePct(){
  return (state.settings&&state.settings.waste_factor_pct!=null)?state.settings.waste_factor_pct:15;
}
function computeMaterialOrder(m,wp){
  const sq=Number(m.total_squares||0),ridge=Number(m.ridge_lf||0),hip=Number(m.hip_lf||0),
    valley=Number(m.valley_lf||0),eave=Number(m.eave_lf||0),rake=Number(m.rake_lf||0);
  const waste=Number(wp||15)/100, adjSq=sq*(1+waste), capLf=ridge+hip;
  const items=[
    {material:'Field shingles',detail:adjSq.toFixed(1)+' sq incl. '+Math.round(waste*100)+'% waste',
      qty:Math.ceil(adjSq*3),unit:'bundles'},
    {material:'Starter strip',detail:(eave+rake).toFixed(0)+' lf (eaves + rakes)',
      qty:Math.ceil((eave+rake)/100),unit:'bundles'},
    {material:'Hip & ridge cap',detail:capLf.toFixed(0)+' lf (ridge + hip)',
      qty:Math.ceil(capLf/25),unit:'bundles'},
    {material:'Underlayment (synthetic)',detail:sq.toFixed(1)+' sq of roof area',
      qty:Math.ceil(sq/10),unit:'rolls'},
    {material:'Ice & water shield',detail:(eave+valley).toFixed(0)+' lf (eaves + valleys)',
      qty:Math.ceil((eave+valley)/65),unit:'rolls'},
    {material:'Drip edge',detail:(eave+rake).toFixed(0)+' lf (eaves + rakes)',
      qty:Math.ceil((eave+rake)/10),unit:'10-ft pieces'},
    {material:'Valley metal',detail:valley.toFixed(0)+' lf (open valleys)',
      qty:Math.ceil(valley/10),unit:'10-ft pieces'},
    {material:'Roofing nails',detail:'about 2.5 lb per square',
      qty:Math.ceil(sq*2.5),unit:'lb'},
    {material:'Ridge vent',detail:ridge.toFixed(0)+' lf of ridge (if vented)',
      qty:Math.ceil(ridge/4),unit:'4-ft pieces'},
    {material:'Pipe boots & step flashing',detail:'Not derived from measurements — verify on site',
      qty:null,unit:'—'},
  ];
  return {waste_pct:Math.round(waste*100),adjusted_squares:Number(adjSq.toFixed(1)),items};
}

  if(!order||!order.items||!order.adjusted_squares)

/* ==================== SUPPORT BOT — NOTIFICATIONS ==================== */
// Reconcile in-app reminders: every sold job that isn't build-ready gets a
// notification for its assigned rep and the company's admins. When a job
// becomes ready (or leaves "Won"), its reminders are cleared.
async function reconcileNotifications(){
  if(!currentCompany)return;
  const adminIds=state.members.filter(m=>m.role==='owner'||m.role==='admin').map(m=>m.user_id);
  const desired=[];
  state.deals.filter(d=>d.stage==='Won'&&!buildReady(d)).forEach(d=>{
    const recips=new Set(adminIds);
    if(d.assigned_to)recips.add(d.assigned_to);
    recips.forEach(uid=>{ if(uid) desired.push({deal:d,user_id:uid}); });
  });
  const k=(dl,u)=>dl+'|'+u;
  const wantSet=new Set(desired.map(x=>k(x.deal.id,x.user_id)));
  const existing=state.notifications.filter(n=>n.type==='job_incomplete');
  const haveSet=new Set(existing.map(n=>k(n.deal_id,n.user_id)));
  const toInsert=desired.filter(x=>!haveSet.has(k(x.deal.id,x.user_id))).map(x=>{
    const d=x.deal,c=contact(d.contact_id);
    return {user_id:x.user_id,deal_id:d.id,type:'job_incomplete',
      title:'Incomplete job — '+(d.title||'Untitled job'),
      body:(c?c.name+' · ':'')+'still needs: '+missingItems(d).join(', ')
        +'. Finish these before it can move to Build.'};
  });
  const toDelete=existing.filter(n=>!wantSet.has(k(n.deal_id,n.user_id))).map(n=>n.id);
  let changed=false;
  if(toInsert.length){
    const {error}=await sb.from('notifications')
      .upsert(toInsert,{onConflict:'deal_id,user_id,type',ignoreDuplicates:true});
    if(!error)changed=true;
  }
  if(toDelete.length){
    const {error}=await sb.from('notifications').delete().in('id',toDelete);
    if(!error)changed=true;
  }
  if(changed){
    const {data}=await sb.from('notifications').select('*').order('created_at',{ascending:false});
    if(data)state.notifications=data;
  }
}
