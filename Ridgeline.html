    <h3>Pending Invitations <span class="count">${invites.length}</span></h3>
    ${invites.length?invites.map(iv=>`<div class="mini-item"><div class="mi-top">
      <span>${esc(iv.email)} <span class="badge b-gray">${roleLabel(iv.role)}</span></span>
      <button class="btn sm secondary" onclick="revokeInvite('${iv.id}')">Revoke</button></div>
      <div class="mi-sub">Invited ${fmtDate(iv.created_at)} · they join by signing up with this email</div></div>`).join('')
      :`<div class="mi-sub">No pending invitations. Invite a teammate and they join automatically when they sign up with that email.</div>`}
  </div>`:''}
  <div class="note-box" style="margin-top:20px">
    <h3>How team access works</h3>
    <div style="font-size:13px;color:#c3d3e8;line-height:1.7">
      <strong>Owner</strong> — full control, including the team.<br>
      <strong>Admin</strong> — manages the team, every job and customer, and company settings.<br>
      <strong>Rep</strong> — works every job and customer; can't change company settings or the team.<br>
      Everyone on the team shares the same customers, pipeline, jobs and reviews.
    </div>
  </div>`;
}
function openInviteForm(){
  if(!isAdmin()){alert('Only owners and admins can invite teammates.');return;}
  openModal(`
  <div class="modal-head"><h2>Invite a Teammate</h2>
    <button class="icon-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>Email address *</label>
      <input type="email" id="inv_email" placeholder="teammate@example.com"></div>
    <div class="field"><label>Role</label>
      <select id="inv_role">
        <option value="rep">Rep — works jobs and customers</option>
        <option value="admin">Admin — also manages the team and settings</option>
      </select></div>
    <div style="font-size:11.5px;color:var(--muted)">They can sign up with this exact email and will join ${esc(currentCompany?currentCompany.name:'your company')} automatically. Send them the Ridgeline link and ask them to create an account.</div>
  </div>
  <div class="modal-foot">
    <button class="btn secondary" onclick="closeModal()">Cancel</button>
    <button class="btn" id="invBtn" onclick="sendInvite()">Send Invite</button>
  </div>`);
}
async function sendInvite(){
  const email=val('inv_email'),role=val('inv_role');
  if(!email){alert('Enter an email address.');return;}
  const btn=document.getElementById('invBtn');if(btn){btn.disabled=true;btn.textContent='Inviting…';}
  try{
    const {error}=await sb.rpc('invite_member',{p_email:email,p_role:role});
    if(error)throw error;
    const {data}=await sb.from('invitations').select('*').eq('status','pending').order('created_at',{ascending:false});
    state.invitations=data||[];
    closeModal();render();
    alert('Invite sent to '+email+'. Have them sign up with that email to join your team.');
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Send Invite';}
    alert('Could not send invite: '+(e.message||e));
  }
}
async function revokeInvite(id){
  if(!confirm('Revoke this invitation? They will no longer be able to join with that email.'))return;
  try{
    const {error}=await sb.rpc('revoke_invitation',{p_id:id});
    if(error)throw error;
    state.invitations=state.invitations.filter(x=>x.id!==id);
    render();
  }catch(e){alert('Could not revoke: '+(e.message||e));}
}
async function changeRole(userId,role){
  try{
    const {error}=await sb.rpc('set_member_role',{p_user_id:userId,p_role:role});
    if(error)throw error;
    const m=state.members.find(x=>x.user_id===userId);if(m)m.role=role;
    if(userId===currentUser.id)currentMembership=m;
    buildNav();render();
  }catch(e){alert('Could not change role: '+(e.message||e));render();}
}
async function removeMember(userId){
  const m=state.members.find(x=>x.user_id===userId);
  const nm=m?(m.display_name||m.email||'this teammate'):'this teammate';
  if(!confirm('Remove '+nm+' from the team? They lose access immediately. Their jobs and notes stay with the company.'))return;
  try{
    const {error}=await sb.rpc('remove_member',{p_user_id:userId});
    if(error)throw error;
    state.members=state.members.filter(x=>x.user_id!==userId);
    render();
  }catch(e){alert('Could not remove teammate: '+(e.message||e));}
}

/* ==================== PLATFORM — SEO COMMAND ====================
   Operator-only. Everything here spans all sites and sits outside the
   multi-tenant boundary entirely. */
function pctOf(a,b){ return b ? Math.round(a/b*1000)/10 : null; }
function ago(ts){
  if(!ts) return 'never';
  const d = Math.round((Date.now()-new Date(ts))/86400000);
  return d<=0 ? 'today' : d===1 ? 'yesterday' : d+' days ago';
}

function viewPlatformSEO(){
  const v=document.getElementById('view');
  if(!platformData){
    v.innerHTML='<div class="view-head"><div><h1>SEO Command</h1>'
      +'<p>Reading the estate\u2026</p></div></div>';
    sb.rpc('platform_overview',{p_days:platformDays}).then(({data,error})=>{
      if(error){
        v.innerHTML='<div class="view-head"><div><h1>SEO Command</h1></div></div>'
          +'<div class="panel"><div class="mi-sub">'+esc(error.message)+'</div></div>';
        return;
      }
      platformData=data; renderPlatformSEO();
    });
    return;
  }
  renderPlatformSEO();
}

function renderPlatformSEO(){
  const d=platformData, r=d.reviews||{}, f=d.funnel||{}, p=d.pipeline||{}, hlth=d.data_health||{};
  const gap=Number(r.gap||0);
  const pctToTarget = r.target ? Math.min(100, Math.round(r.current/r.target*100)) : 0;

  const landing=(f.by_landing||[]).slice(0,10);
  const maxSess=Math.max(1,...landing.map(x=>x.sessions||0));
  const srcRows=(f.by_source||[]).slice(0,12);
  const maxSrc=Math.max(1,...srcRows.map(x=>x.sessions||0));

  document.getElementById('view').innerHTML=`
  <div class="view-head">
    <div><h1>SEO Command</h1>
      <p>Every site you run. Only you can open this \u2014 it sits above the company layer.</p></div>
    <div style="display:flex;gap:8px">
      ${[7,30,90].map(n=>`<button class="btn ${n===platformDays?'':'secondary'}"
        onclick="platformDays=${n};platformData=null;viewPlatformSEO()">${n}d</button>`).join('')}
      <button class="btn secondary" onclick="platformData=null;viewPlatformSEO()">\u21bb</button>
    </div>
  </div>

  <div class="panel" style="margin-bottom:18px;border-left:4px solid ${gap>0?'var(--amber)':'var(--green)'}">
    <h3>The constraint \u2014 Google reviews</h3>
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
      <div style="font-size:34px;font-weight:800;color:var(--text)">${r.current==null?'\u2014':r.current}</div>
      <div style="color:var(--muted);font-size:13px">of ${r.target||'\u2014'} needed for the third map-pack slot
        ${gap>0?`\u00b7 <strong style="color:var(--amber)">${gap} to go</strong>`:'\u00b7 <strong style="color:var(--green)">target reached</strong>'}
        \u00b7 last confirmed ${ago(r.as_of)}</div>
    </div>
    <div class="prog-track" style="margin-top:10px"><div class="prog-fill" style="width:${pctToTarget}%"></div></div>
    <div class="mi-sub" style="margin-top:9px">Nothing on the site outranks this. Rankings follow reviews in the
      local pack, not the other way round \u2014 and the last jump came from asking customers directly,
      not from anything we changed on the page.</div>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="label">Sessions</div><div class="value blue">${f.sessions||0}</div>
      <div class="sub">${f.views||0} page views</div></div>
    <div class="stat"><div class="label">Leads</div><div class="value">${f.leads||0}</div>
      <div class="sub">${pctOf(f.leads||0,f.sessions||0)==null?'\u2014':pctOf(f.leads||0,f.sessions||0)+'% of sessions'}</div></div>
    <div class="stat"><div class="label">Inspections booked</div><div class="value amber">${f.booked||0}</div>
      <div class="sub">${pctOf(f.booked||0,f.leads||0)==null?'\u2014':pctOf(f.booked||0,f.leads||0)+'% of leads'}</div></div>
    <div class="stat"><div class="label">Sold</div><div class="value green">${money(f.sold_value||0)}</div>
      <div class="sub">${f.sold||0} job${(f.sold||0)===1?'':'s'}</div></div>
    <div class="stat"><div class="label">Open pipeline</div><div class="value">${money(p.open_value||0)}</div>
      <div class="sub">${p.open_deals||0} still winnable</div></div>
  </div>

  <div class="panel" style="margin-bottom:18px">
    <h3>What the traffic is worth <span class="count">by landing page</span></h3>
    ${landing.length?landing.map(x=>`
      <div class="bar-row">
        <div class="bl seo-path" title="${esc(x.path)}">${esc(x.path)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(x.sessions/maxSess*100)}%"></div></div>
        <div class="bv seo-val">${x.sessions} sess \u00b7 ${x.leads} lead${x.leads===1?'':'s'}${Number(x.value)?' \u00b7 '+money(x.value):''}</div>
      </div>`).join('')
      :'<div class="mi-sub">No sessions in this window yet. Once the site is repointed this fills in on its own.</div>'}
    <div class="mi-sub" style="margin-top:10px">Sessions are attributed to the FIRST page of the visit, not the page
      someone happened to convert on \u2014 the contact page never earned a lead, the page that brought them did.</div>
  </div>

  <div class="panel" style="margin-bottom:18px">
    <h3>Where the traffic came from <span class="count">by channel</span></h3>
    ${srcRows.length?srcRows.map(x=>`
      <div class="bar-row">
        <div class="bl" style="width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${x.source==='untagged'?'<span style="color:var(--muted)">untagged</span>':esc(x.source)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(x.sessions/maxSrc*100)}%;
          ${x.source==='untagged'?'opacity:.45':''}"></div></div>
        <div class="bv" style="width:150px">${x.sessions} sess \u00b7 ${x.leads} lead${x.leads===1?'':'s'}${Number(x.value)?' \u00b7 '+money(x.value):''}</div>
      </div>`).join('')
      :'<div class="mi-sub">Nothing tagged yet. Publish profile links with <code>?s=</code> and each channel separates out here.</div>'}
    <div class="mi-sub" style="margin-top:10px">A visit counts against the channel on its ENTRY link, kept for the whole
      session. <strong>Untagged</strong> is everything that arrived without one \u2014 direct, unlinked, or a profile
      whose link still needs the tag; it is shown rather than hidden so you can see how much is unaccounted for.</div>
  </div>

  <div class="panel-grid">
    <div class="panel">
      <h3>Sites <span class="count">${(d.sites||[]).length}</span></h3>
      ${(d.sites||[]).map(s=>`<div class="mini-item">
        <div class="mi-top"><span><strong>${esc(s.name)}</strong></span>
          ${s.wired?'<span class="badge b-green">wired to CRM</span>'
                   :'<span class="badge b-gray">not wired</span>'}</div>
        <div class="mi-sub">${esc((s.domain||'').replace(/^https?:\/\//,''))}
          \u00b7 ${s.views||0} views \u00b7 ${s.leads||0} leads</div>
        <div class="mi-sub">${s.last_run
          ? 'audited '+ago(s.last_run.at)+' \u00b7 '+(s.last_run.pages||'?')+' pages'
            +(s.last_run.score?' \u00b7 score '+s.last_run.score:'')
          : 'never audited'}${s.open_findings?` \u00b7 <strong style="color:var(--amber)">${s.open_findings} open issue${s.open_findings===1?'':'s'}</strong>`:''}</div>
      </div>`).join('')}
    </div>

    <div class="panel" style="grid-column:1/-1">
      <h3>Tracked keywords <span class="count">${(d.keywords||[]).length}</span>
        <span class="mi-sub" style="font-weight:400"> \u00b7 ordered by intent price, not traffic</span></h3>
      ${(d.keywords||[]).length?(d.keywords||[]).map(k=>{
        const mine=d.my_reviews, weak=k.weakest_slot;
        const gap=(weak!=null&&mine!=null)?weak-mine:null;
        // Green once a slot is within reach of a month of asking; amber while
        // it is a quarter's work; grey when it is not this year's problem.
        const gapCls=gap==null?'b-gray':gap<=0?'b-green':gap<=25?'b-green':gap<=90?'b-amber':'b-gray';
        return `<div class="mini-item">
        <div class="mi-top"><span><strong>${esc(k.keyword)}</strong></span>
          <span>
            ${k.pack_position?`<span class="badge b-green">pack #${k.pack_position}</span> `:''}
            <span class="badge ${k.position?(k.position<=3?'b-green':k.position<=10?'b-amber':'b-gray'):'b-gray'}">
              ${k.position?('organic #'+k.position):'unranked'}</span></span></div>
        <div class="mi-sub">
          ${Number(k.intent_value)?'<strong>'+money(k.intent_value)+'/mo of intent</strong> \u00b7 ':''}
          ${k.volume?k.volume.toLocaleString()+' searches':'volume unmeasured'}
          ${Number(k.cpc)?' at '+money(k.cpc)+' a click':''}
          \u00b7 ${esc(k.freq||'weekly')}</div>
        ${weak!=null?`<div class="mi-sub" style="margin-top:5px">
          Cheapest way into this pack: <strong>${weak}</strong> review${weak===1?'':'s'}
          <span class="badge ${gapCls}">${gap<=0?'in range now':gap+' to go'}</span></div>`:''}
        ${(k.pack||[]).length?`<div class="mi-sub" style="margin-top:4px;opacity:.85">
          ${(k.pack||[]).map(p=>esc(p.name)+' '+(p.reviews==null?'?':p.reviews)).join(' \u00b7 ')}</div>`:''}
        <div class="mi-sub" style="margin-top:4px">${k.target_url?'targets '+esc(k.target_url)+' \u00b7 ':''}${k.checked?'checked '+ago(k.checked):'<strong style="color:var(--amber)">never checked</strong>'}</div>
      </div>`}).join('')
      :'<div class="mi-sub">No keywords tracked yet.</div>'}
      <div class="mi-sub" style="margin-top:12px">Intent price is monthly searches \u00d7 cost per click \u2014 what
        advertisers actually pay to reach this search. The head term carries four times the traffic of
        <em>roof repair phoenix</em> at a third of the value per visit, so ordering by traffic alone puts the
        wrong keyword first.</div>
    </div>

    <div class="panel" style="grid-column:1/-1">
      <h3>Open findings <span class="count">${(d.findings||[]).length}</span></h3>

      </div>`).join('')

    <div class="panel" style="grid-column:1/-1">

        <span class="ck-label">${hlth.leads_without_session||0} lead${(hlth.leads_without_session||0)===1?'':'s'} that cannot be traced to a page</span></div>
      <div class="ck-row"><span class="ck-mark ${hlth.stale_rankings?'todo':'done'}">${hlth.stale_rankings?'!':'\u2713'}</span>
        <span class="ck-label">${hlth.stale_rankings||0} tracked keyword${(hlth.stale_rankings||0)===1?'':'s'} not checked in 48 hours</span></div>
      <div class="ck-row"><span class="ck-mark ${hlth.untagged_sessions?'todo':'done'}">${hlth.untagged_sessions?'!':'\u2713'}</span>

      <div class="ck-row"><span class="ck-mark done">\u2713</span>
        <span class="ck-label">${hlth.intake_keys_live||0} intake key${(hlth.intake_keys_live||0)===1?'':'s'} live</span></div>
    </div>

}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ridgeline-backup-'+todayStr()+'.json';
  a.click();
}

  if(session&&session.user){

    currentUser=null;currentCompany=null;currentMembership=null;appLoaded=false;
