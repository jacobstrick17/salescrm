<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legacy CRM</title>
<style>
  :root{
    --bg:#f1f5f9; --sidebar:#0f172a; --sidebar-2:#1e293b;
    --primary:#2563eb; --primary-dark:#1d4ed8;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --card:#ffffff; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:230px;background:var(--sidebar);color:#cbd5e1;display:flex;flex-direction:column;
    position:fixed;top:0;bottom:0;left:0;}
  .logo{padding:22px 20px;font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px;
    display:flex;align-items:center;gap:9px;border-bottom:1px solid #1e293b;}
  .logo .mark{width:30px;height:30px;border-radius:7px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:15px;}
  .nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:8px;
    color:#cbd5e1;text-decoration:none;font-weight:500;cursor:pointer;transition:.12s;}
  .nav a:hover{background:var(--sidebar-2);color:#fff;}
  .nav a.active{background:var(--primary);color:#fff;}
  .nav a .ico{width:18px;text-align:center;font-size:15px;}
  .nav .label-sm{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#475569;
    padding:14px 13px 6px;font-weight:700;}
  .sidebar-foot{padding:12px;border-top:1px solid #1e293b;display:flex;flex-direction:column;gap:6px;}
  .sidebar-foot button{width:100%;background:var(--sidebar-2);color:#cbd5e1;border:none;
    padding:8px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;}
  .sidebar-foot button:hover{background:#334155;color:#fff;}

  /* Main */
  .main{margin-left:230px;flex:1;padding:26px 32px 60px;width:calc(100% - 230px);}
  .view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;
    flex-wrap:wrap;gap:14px;}
  .view-head h1{font-size:23px;font-weight:700;}
  .view-head p{color:var(--muted);font-size:13px;margin-top:2px;}

  /* Buttons */
  .btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:8px;
    font-weight:600;cursor:pointer;font-size:13px;transition:.12s;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn.secondary:hover{background:#f8fafc;}
  .btn.danger{background:var(--red);}
  .btn.danger:hover{background:#b91c1c;}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;
    padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:#f1f5f9;color:var(--text);}

  /* Cards / grid */
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:22px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
  .stat .label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .stat .value{font-size:26px;font-weight:700;margin-top:6px;}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .stat .value.green{color:var(--green);} .stat .value.red{color:var(--red);}
  .stat .value.blue{color:var(--primary);} .stat .value.amber{color:var(--amber);}

  .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;}
  .panel h3{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .panel h3 .count{font-size:12px;color:var(--muted);font-weight:500;}

  /* Tables */
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    padding:10px 12px;border-bottom:1px solid var(--border);font-weight:700;}
  td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#f8fafc;}
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden;}
  .name-link{color:var(--primary);font-weight:600;cursor:pointer;}
  .name-link:hover{text-decoration:underline;}

  /* Badges */
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .b-lead{background:#dbeafe;color:#1d4ed8;}
  .b-customer{background:#dcfce7;color:#15803d;}
  .b-gray{background:#f1f5f9;color:#475569;}
  .b-green{background:#dcfce7;color:#15803d;}
  .b-amber{background:#fef3c7;color:#b45309;}
  .b-red{background:#fee2e2;color:#b91c1c;}

  /* Toolbar */
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],
  select,textarea{font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--border);
    border-radius:8px;background:#fff;color:var(--text);width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--primary);}
  .search{max-width:280px;}
  .filter{max-width:170px;}

  /* Kanban */
  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
  .col{min-width:230px;width:230px;flex-shrink:0;background:#eef2f7;border-radius:11px;padding:10px;}
  .col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:2px 4px;}
  .col-head .ct{font-weight:700;font-size:13px;}
  .col-head .sum{font-size:11px;color:var(--muted);font-weight:600;}
  .col.drag-over{outline:2px dashed var(--primary);outline-offset:-3px;}
  .deal{background:#fff;border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:9px;
    cursor:grab;box-shadow:var(--shadow);}
  .deal:active{cursor:grabbing;}
  .deal .dt{font-weight:600;font-size:13px;margin-bottom:3px;}
  .deal .dc{font-size:12px;color:var(--muted);}
  .deal .dv{font-weight:700;color:var(--green);font-size:13px;margin-top:6px;}
  .deal .dmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .deal .dmeta small{color:var(--muted);font-size:11px;}
  .col-stripe{height:3px;border-radius:3px;margin-bottom:9px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;
    align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .modal.wide{max-width:720px;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;
    justify-content:space-between;align-items:center;}
  .modal-head h2{font-size:17px;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;
    justify-content:flex-end;gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:#334155;margin-bottom:5px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  /* Detail modal */
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:8px;}
  .detail-grid .dl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;}
  .detail-grid .dv{font-size:13px;margin-top:1px;}
  .sub-section{margin-top:18px;}
  .sub-section h4{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .mini-item{padding:8px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;font-size:12.5px;}
  .mini-item .mi-top{display:flex;justify-content:space-between;}
  .mini-item .mi-sub{color:var(--muted);font-size:11.5px;margin-top:2px;}

  /* Bars */
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .bar-row .bl{width:88px;flex-shrink:0;color:#334155;font-weight:600;}
  .bar-track{flex:1;background:#eef2f7;border-radius:6px;height:20px;position:relative;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:var(--primary);min-width:2px;}
  .bar-row .bv{width:78px;text-align:right;flex-shrink:0;color:var(--muted);font-weight:600;}

  /* Empty */
  .empty{text-align:center;padding:48px 20px;color:var(--muted);}
  .empty .big{font-size:34px;margin-bottom:10px;}

  /* Training */
  .train-progress{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);padding:18px 20px;margin-bottom:20px;}
  .prog-track{background:#eef2f7;border-radius:8px;height:14px;overflow:hidden;margin-top:8px;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--primary),#3b82f6);border-radius:8px;transition:.3s;}
  .module{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);margin-bottom:13px;overflow:hidden;}
  .module-head{padding:15px 18px;cursor:pointer;display:flex;align-items:center;gap:13px;}
  .module-head:hover{background:#f8fafc;}
  .module-num{width:34px;height:34px;border-radius:9px;background:#dbeafe;color:var(--primary-dark);
    display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .module-head .mh-title{flex:1;font-weight:700;font-size:14.5px;}
  .module-head .mh-meta{font-size:12px;color:var(--muted);}
  .module-head .chev{color:var(--muted);transition:.2s;}
  .module.open .chev{transform:rotate(90deg);}
  .lessons{display:none;border-top:1px solid var(--border);}
  .module.open .lessons{display:block;}
  .lesson{padding:14px 18px 14px 20px;border-bottom:1px solid var(--border);display:flex;gap:13px;}
  .lesson:last-child{border-bottom:none;}
  .lesson .lcheck{flex-shrink:0;}
  .lesson .lcheck input{width:18px;height:18px;cursor:pointer;margin-top:2px;}
  .lesson-body{flex:1;}
  .lesson-body .lt{font-weight:600;font-size:13.5px;margin-bottom:4px;}
  .lesson-body .lt.done{text-decoration:line-through;color:var(--muted);}
  .lesson-body .lc{font-size:13px;color:#334155;}
  .lesson-body .lk{font-size:12.5px;color:var(--primary-dark);background:#eff6ff;
    border-left:3px solid var(--primary);padding:7px 11px;border-radius:0 6px 6px 0;margin-top:8px;}

  .note-box{background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);padding:18px 20px;margin-top:20px;}
  .note-box h3{font-size:15px;margin-bottom:10px;}
  .note-box textarea{min-height:120px;resize:vertical;}
  .save-hint{font-size:12px;color:var(--green);margin-top:8px;display:none;}

  .row-actions{display:flex;gap:2px;justify-content:flex-end;}
  @media(max-width:840px){
    .panel-grid{grid-template-columns:1fr;}
    .sidebar{width:64px;}
    .logo span.txt,.nav a span.txt,.nav .label-sm,.sidebar-foot{display:none;}
    .main{margin-left:64px;width:calc(100% - 64px);padding:20px 16px 50px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="mark">L</div><span class="txt">Legacy CRM</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button onclick="exportData()">⬇ Export data</button>
      <button onclick="document.getElementById('importFile').click()">⬆ Import data</button>
      <button onclick="resetData()">↺ Reset all</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============================ STATE ============================ */
const STORAGE_KEY = 'legacyCRM_v1';
const STAGES = ['New','Contacted','Qualified','Proposal','Negotiation','Won','Lost'];
const STAGE_COLOR = {New:'#64748b',Contacted:'#0ea5e9',Qualified:'#6366f1',
  Proposal:'#a855f7',Negotiation:'#d97706',Won:'#16a34a',Lost:'#dc2626'};
const ACT_ICON = {Call:'📞',Meeting:'🤝',Email:'✉️',Note:'📝'};

let state = {contacts:[],deals:[],activities:[],reminders:[],training:{progress:{},notes:''}};
let currentView = 'dashboard';

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}

function load(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      state = JSON.parse(raw);
      state.training = state.training || {progress:{},notes:''};
      state.training.progress = state.training.progress || {};
    }catch(e){ seed(); }
  } else { seed(); }
}

function seed(){
  const t = new Date();
  const d = n => { const x=new Date(t); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
  const c = [
    {id:uid(),name:'Sarah Johnson',company:'Northwind Traders',type:'Lead',status:'New',
      email:'sarah.johnson@northwind.com',phone:'(555) 204-1180',title:'Operations Manager',
      source:'Website',notes:'Downloaded pricing guide. Interested in annual plan.',created:d(-6)},
    {id:uid(),name:'Michael Chen',company:'Contoso Ltd.',type:'Lead',status:'Working',
      email:'m.chen@contoso.com',phone:'(555) 661-7724',title:'VP of Sales',
      source:'Referral',notes:'Referred by Emily Rodriguez. Evaluating enterprise license.',created:d(-12)},
    {id:uid(),name:'Emily Rodriguez',company:'Fabrikam Inc.',type:'Customer',status:'Active',
      email:'emily.r@fabrikam.com',phone:'(555) 339-0042',title:'Director of Procurement',
      source:'Outbound',notes:'Renewal coming up. Very happy with onboarding.',created:d(-210)},
    {id:uid(),name:'David Thompson',company:'Adventure Works',type:'Customer',status:'At Risk',
      email:'d.thompson@adventure-works.com',phone:'(555) 887-3310',title:'General Manager',
      source:'Trade Show',notes:'Mentioned budget pressure last call. Needs attention.',created:d(-340)},
    {id:uid(),name:'Lisa Anderson',company:'Tailspin Toys',type:'Lead',status:'Nurturing',
      email:'lisa.a@tailspintoys.com',phone:'(555) 122-9087',title:'Owner',
      source:'Social Media',notes:'Small business. Price sensitive but engaged.',created:d(-20)},
  ];
  const dl = [
    {id:uid(),title:'Annual Service Package',contactId:c[0].id,value:12000,stage:'Qualified',
      expectedClose:d(25),notes:'Awaiting sign-off from finance.',created:d(-5)},
    {id:uid(),title:'Enterprise License (50 seats)',contactId:c[1].id,value:45000,stage:'Proposal',
      expectedClose:d(14),notes:'Proposal sent. Follow up scheduled.',created:d(-11)},
    {id:uid(),title:'2026 Renewal',contactId:c[2].id,value:28000,stage:'Negotiation',
      expectedClose:d(8),notes:'Negotiating multi-year discount.',created:d(-18)},
    {id:uid(),title:'Starter Plan',contactId:c[4].id,value:6500,stage:'Contacted',
      expectedClose:d(40),notes:'Sent intro deck.',created:d(-9)},
    {id:uid(),title:'Account Expansion',contactId:c[3].id,value:18000,stage:'New',
      expectedClose:d(55),notes:'Opportunity to add a second location.',created:d(-2)},
    {id:uid(),title:'Q1 Pilot Program',contactId:c[2].id,value:9000,stage:'Won',
      expectedClose:d(-30),notes:'Closed and delivered.',created:d(-70)},
  ];
  const a = [
    {id:uid(),contactId:c[1].id,type:'Call',date:d(-1),summary:'Discussed proposal details and timeline. Decision expected in two weeks.',created:d(-1)},
    {id:uid(),contactId:c[2].id,type:'Meeting',date:d(-2),summary:'Renewal planning meeting. Reviewed usage and upcoming needs.',created:d(-2)},
    {id:uid(),contactId:c[0].id,type:'Email',date:d(-3),summary:'Sent pricing breakdown and case study.',created:d(-3)},
    {id:uid(),contactId:c[3].id,type:'Note',date:d(-4),summary:'Account flagged at risk - schedule a check-in call.',created:d(-4)},
    {id:uid(),contactId:c[4].id,type:'Call',date:d(-5),summary:'Intro call. Walked through starter plan features.',created:d(-5)},
  ];
  const r = [
    {id:uid(),title:'Follow up with Michael on the enterprise proposal',contactId:c[1].id,dueDate:d(1),done:false,created:d(-1)},
    {id:uid(),title:'Send renewal paperwork to Emily',contactId:c[2].id,dueDate:d(3),done:false,created:d(-2)},
    {id:uid(),title:'Check-in call with David (at-risk account)',contactId:c[3].id,dueDate:d(-2),done:false,created:d(-4)},
    {id:uid(),title:'Prepare proposal for Sarah / Northwind',contactId:c[0].id,dueDate:d(5),done:false,created:d(-3)},
  ];
  state = {contacts:c,deals:dl,activities:a,reminders:r,training:{progress:{},notes:''}};
  save();
}

/* ============================ HELPERS ============================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function money(n){return '$'+Number(n||0).toLocaleString('en-US');}
function fmtDate(s){if(!s)return '—';const p=s.split('-');
  if(p.length!==3)return s;
  const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[+p[1]-1]+' '+(+p[2])+', '+p[0];}
function contact(id){return state.contacts.find(c=>c.id===id);}
function contactName(id){const c=contact(id);return c?c.name:'—';}
function daysUntil(s){if(!s)return 9999;
  const d=new Date(s+'T00:00:00'),t=new Date(todayStr()+'T00:00:00');
  return Math.round((d-t)/86400000);}

/* ============================ NAV ============================ */
const NAV = [
  {sec:'Workspace'},
  {id:'dashboard',ico:'◫',label:'Dashboard'},
  {id:'contacts',ico:'☰',label:'Contacts'},
  {id:'pipeline',ico:'▥',label:'Pipeline'},
  {id:'activities',ico:'✦',label:'Activities'},
  {id:'reminders',ico:'◷',label:'Reminders'},
  {sec:'Develop'},
  {id:'training',ico:'★',label:'Sales Training'},
];
function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML = NAV.map(n=>{
    if(n.sec) return `<div class="label-sm">${n.sec}</div>`;
    return `<a data-view="${n.id}" class="${n.id===currentView?'active':''}" onclick="go('${n.id}')">
      <span class="ico">${n.ico}</span><span class="txt">${n.label}</span></a>`;
  }).join('');
}
function go(view){
  currentView=view;
  buildNav();
  render();
  window.scrollTo(0,0);
}
function render(){
  const v=document.getElementById('view');
  if(currentView==='dashboard')v.innerHTML=viewDashboard();
  else if(currentView==='contacts')v.innerHTML=viewContacts();
  else if(currentView==='pipeline'){v.innerHTML=viewPipeline();wireKanban();}
  else if(currentView==='activities')v.innerHTML=viewActivities();
  else if(currentView==='reminders')v.innerHTML=viewReminders();
  else if(currentView==='training')v.innerHTML=viewTraining();
}

/* ============================ DASHBOARD ============================ */
function viewDashboard(){
  const cs=state.contacts;
  const leads=cs.filter(c=>c.type==='Lead').length;
  const customers=cs.filter(c=>c.type==='Customer').length;
  const openDeals=state.deals.filter(d=>d.stage!=='Won'&&d.stage!=='Lost');
  const pipeVal=openDeals.reduce((s,d)=>s+Number(d.value||0),0);
  const wonVal=state.deals.filter(d=>d.stage==='Won').reduce((s,d)=>s+Number(d.value||0),0);
  const overdue=state.reminders.filter(r=>!r.done&&daysUntil(r.dueDate)<0).length;
  const openRem=state.reminders.filter(r=>!r.done).length;

  // pipeline by stage
  const byStage=STAGES.map(st=>{
    const ds=state.deals.filter(d=>d.stage===st);
    return {st,count:ds.length,val:ds.reduce((s,d)=>s+Number(d.value||0),0)};
  });
  const maxVal=Math.max(1,...byStage.map(b=>b.val));

  // upcoming reminders
  const upcoming=state.reminders.filter(r=>!r.done)
    .sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')).slice(0,5);
  // recent activity
  const recent=[...state.activities].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);

  return `
  <div class="view-head">
    <div><h1>Dashboard</h1><p>Your sales snapshot for ${fmtDate(todayStr())}</p></div>
    <button class="btn" onclick="openContactForm()">+ New Contact</button>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="label">Total Contacts</div><div class="value blue">${cs.length}</div>
      <div class="sub">${leads} leads · ${customers} customers</div></div>
    <div class="stat"><div class="label">Open Deals</div><div class="value">${openDeals.length}</div>

function viewPipeline(){
  const open=state.deals.filter(d=>d.stage!=='Won'&&d.stage!=='Lost');
  const total=open.reduce((s,d)=>s+Number(d.value||0),0);
  return `
  <div class="view-head">
    <div><h1>Pipeline</h1><p>${open.length} open deals · ${money(total)} in play · drag cards to move stages</p></div>
    <button class="btn" onclick="openDealForm()">+ New Deal</button>
  </div>
  <div class="kanban">${STAGES.map(st=>{
    const ds=state.deals.filter(d=>d.stage===st);
    const sum=ds.reduce((s,d)=>s+Number(d.value||0),0);
    return `<div class="col" data-stage="${st}">
      <div class="col-stripe" style="background:${STAGE_COLOR[st]}"></div>
      <div class="col-head"><span class="ct">${st}</span>
        <span class="sum">${ds.length} · ${money(sum)}</span></div>
      ${ds.map(d=>dealCard(d)).join('')||'<div style="font-size:12px;color:#94a3b8;padding:6px 4px">No deals</div>'}
    </div>`;
  }).join('')}</div>`;
}
function dealCard(d){
  return `<div class="deal" draggable="true" data-id="${d.id}">
    <div class="dt">${esc(d.title)}</div>
    <div class="dc">${esc(contactName(d.contactId))}</div>
    <div class="dv">${money(d.value)}</div>
    <div class="dmeta">
      <small>Close ${fmtDate(d.expectedClose)}</small>
      <span>
        <button class="icon-btn" title="Edit" onclick="openDealForm('${d.id}')">✎</button>
        <button class="icon-btn" title="Delete" onclick="deleteDeal('${d.id}')">🗑</button>
      </span>
    </div>
  </div>`;
}
let dragId=null;
function wireKanban(){
  document.querySelectorAll('.deal').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.id;e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',()=>{dragId=null;
      document.querySelectorAll('.col').forEach(c=>c.classList.remove('drag-over'));});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});
    col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));
    col.addEventListener('drop',e=>{
      e.preventDefault();col.classList.remove('drag-over');
      if(!dragId)return;
      const d=state.deals.find(x=>x.id===dragId);
      if(d&&d.stage!==col.dataset.stage){d.stage=col.dataset.stage;save();render();wireKanban();}
    });
  });
}

/* ============================ REMINDERS ============================ */
let remFilter='Open';
function viewReminders(){
  let list=[...state.reminders];
  if(remFilter==='Open')list=list.filter(r=>!r.done);
  else if(remFilter==='Done')list=list.filter(r=>r.done);
  list.sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    return (a.dueDate||'').localeCompare(b.dueDate||'');
  });
  const overdue=state.reminders.filter(r=>!r.done&&daysUntil(r.dueDate)<0).length;
  return `
  <div class="view-head">
    <div><h1>Reminders</h1><p>${state.reminders.filter(r=>!r.done).length} open · ${overdue} overdue</p></div>
    <button class="btn" onclick="openReminderForm()">+ New Reminder</button>
  </div>
  <div class="toolbar">
    <select class="filter" onchange="remFilter=this.value;render()">
      ${['Open','Done','All'].map(o=>`<option ${o===remFilter?'selected':''}>${o}</option>`).join('')}
    </select>
  </div>
  <div class="table-wrap">${list.length?`<table><thead><tr>
    <th style="width:40px"></th><th>Task</th><th>Contact</th><th>Due</th><th></th></tr></thead><tbody>
    ${list.map(r=>{
      const du=daysUntil(r.dueDate);
      let due=fmtDate(r.dueDate);
      if(!r.done&&du<0)due=`<span class="badge b-red">${due} · ${-du}d late</span>`;
      else if(!r.done&&du===0)due=`<span class="badge b-amber">${due} · today</span>`;
      else due=`<span style="color:var(--muted)">${due}</span>`;
      return `<tr>
        <td><input type="checkbox" ${r.done?'checked':''} style="width:17px;height:17px;cursor:pointer"
          onchange="toggleReminder('${r.id}')"></td>
        <td style="${r.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(r.title)}</td>
        <td>${r.contactId?`<span class="name-link" onclick="openContactDetail('${r.contactId}')">${esc(contactName(r.contactId))}</span>`:'—'}</td>
        <td>${due}</td>
        <td><div class="row-actions">
          <button class="icon-btn" onclick="openReminderForm('${r.id}')">✎</button>
          <button class="icon-btn" onclick="deleteReminder('${r.id}')">🗑</button>
        </div></td>
      </tr>`;
    }).join('')}</tbody></table>`:
    `<div class="empty"><div class="big">◷</div>Nothing here. You're all caught up.</div>`}</div>`;
}
function toggleReminder(id){
  const r=state.reminders.find(x=>x.id===id);
  if(r){r.done=!r.done;save();render();}
}

    contactId:document.getElementById('a_contact').value,summary,
  };
  if(id){Object.assign(state.activities.find(x=>x.id===id),data);}
  else{state.activities.push({id:uid(),created:todayStr(),...data});}
  save();closeModal();render();
}
function deleteActivity(id){
  if(!confirm('Delete this activity?'))return;
  state.activities=state.activities.filter(x=>x.id!==id);
  save();closeModal();render();
}

/* ---- Reminder form ---- */
function openReminderForm(id,presetContact){
  const r=id?state.reminders.find(x=>x.id===id):{};
  openModal(`
  <div class="modal-head"><h2>${id?'Edit':'New'} Reminder</h2>
    <button class="icon-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>Task *</label>
      <input type="text" id="r_title" value="${esc(r.title||'')}" placeholder="e.g. Follow up on proposal"></div>
    <div class="field-row">
      <div class="field"><label>Due date</label>
        <input type="date" id="r_due" value="${r.dueDate||todayStr()}"></div>
      <div class="field"><label>Related contact</label>
        <select id="r_contact"><option value="">— none —</option>${selectContactOptions(r.contactId||presetContact)}</select></div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn secondary" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="saveReminder('${id||''}')">${id?'Save Changes':'Add Reminder'}</button>
  </div>`);
}
function saveReminder(id){
  const title=document.getElementById('r_title').value.trim();
  if(!title){alert('Please enter a task.');return;}
  const data={
    title,dueDate:document.getElementById('r_due').value,
    contactId:document.getElementById('r_contact').value||null,
  };
  if(id){Object.assign(state.reminders.find(x=>x.id===id),data);}
  else{state.reminders.push({id:uid(),done:false,created:todayStr(),...data});}
  save();closeModal();render();
}
function deleteReminder(id){
  if(!confirm('Delete this reminder?'))return;
  state.reminders=state.reminders.filter(x=>x.id!==id);
  save();closeModal();render();
}

function trainStats(){
  let total=0,done=0;
  TRAINING.forEach((m,mi)=>m.lessons.forEach((l,li)=>{
    total++;if(state.training.progress[mi+'-'+li])done++;
  }));
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function viewTraining(){
  const s=trainStats();
  return `
  <div class="view-head">
    <div><h1>Sales Training</h1><p>A structured path through the full sales cycle — ${s.total} lessons</p></div>
  </div>
  <div class="train-progress">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <strong style="font-size:15px">Your progress</strong>
      <span style="color:var(--muted);font-size:13px">${s.done} of ${s.total} lessons · ${s.pct}%</span>
    </div>
    <div class="prog-track"><div class="prog-fill" style="width:${s.pct}%"></div></div>
  </div>
  ${TRAINING.map((m,mi)=>{
    const ld=m.lessons.filter((l,li)=>state.training.progress[mi+'-'+li]).length;
    const open=ld<m.lessons.length;
    return `<div class="module ${open&&mi===firstIncompleteModule()?'open':''}" id="mod${mi}">
      <div class="module-head" onclick="toggleModule(${mi})">
        <div class="module-num">${mi+1}</div>
        <div class="mh-title">${esc(m.title)}
          <div class="mh-meta">${ld}/${m.lessons.length} lessons complete</div></div>
        <div class="chev">▸</div>
      </div>
      <div class="lessons">${m.lessons.map((l,li)=>{
        const dn=!!state.training.progress[mi+'-'+li];
        return `<div class="lesson">
          <div class="lcheck"><input type="checkbox" ${dn?'checked':''}
            onchange="toggleLesson(${mi},${li})"></div>
          <div class="lesson-body">
            <div class="lt ${dn?'done':''}">${esc(l.t)}</div>
            <div class="lc">${esc(l.c)}</div>
            <div class="lk"><strong>Key takeaway:</strong> ${esc(l.k)}</div>
          </div>
        </div>`;
      }).join('')}</div>
    </div>`;
  }).join('')}
  <div class="note-box">
    <h3>My Training Notes</h3>
    <textarea id="trainNotes" placeholder="Jot down scripts, objections you hear, things to practice…"
      oninput="trainNotesChanged()">${esc(state.training.notes||'')}</textarea>
    <div class="save-hint" id="noteHint">✓ Saved</div>
  </div>`;
}
function firstIncompleteModule(){
  for(let mi=0;mi<TRAINING.length;mi++){
    const all=TRAINING[mi].lessons.every((l,li)=>state.training.progress[mi+'-'+li]);
    if(!all)return mi;
  }
  return 0;
}
function toggleModule(mi){
  document.getElementById('mod'+mi).classList.toggle('open');
}
function toggleLesson(mi,li){
  const key=mi+'-'+li;
  if(state.training.progress[key])delete state.training.progress[key];
  else state.training.progress[key]=true;
  save();
  // update progress bar + counts without collapsing modules
  const openModules=[...document.querySelectorAll('.module.open')].map(e=>e.id);
  document.getElementById('view').innerHTML=viewTraining();
  openModules.forEach(id=>{const e=document.getElementById(id);if(e)e.classList.add('open');});
}
let noteTimer=null;
function trainNotesChanged(){
  state.training.notes=document.getElementById('trainNotes').value;
  clearTimeout(noteTimer);
  noteTimer=setTimeout(()=>{
    save();
    const h=document.getElementById('noteHint');
    if(h){h.style.display='block';setTimeout(()=>{if(h)h.style.display='none';},1500);}
  },500);
}

/* ============================ DATA IO ============================ */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='legacy-crm-backup-'+todayStr()+'.json';
  a.click();
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.contacts){throw new Error('bad file');}
      if(!confirm('Importing will replace all current data. Continue?'))return;
      state=data;
      state.training=state.training||{progress:{},notes:''};
      state.training.progress=state.training.progress||{};
      save();render();
      alert('Data imported successfully.');
    }catch(err){alert('That file could not be read as a CRM backup.');}
  };
  reader.readAsText(file);
  e.target.value='';
}
function resetData(){
  if(!confirm('This erases all CRM data and restores the sample data. Continue?'))return;
  localStorage.removeItem(STORAGE_KEY);
  seed();render();
}
