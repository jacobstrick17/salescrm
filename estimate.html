<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- A private document reachable only by an unguessable link. It must never be
     indexed, and it is deliberately absent from the sitemap. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Your Estimate &mdash; Phoenix Roofing Experts</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{--navy:#0f2438;--orange:#e8590c;--g50:#f7f8fa;--g100:#eef0f3;--g200:#dfe3e8;
  --g500:#6b7684;--g700:#33404f;--green:#12684a;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--g50);color:var(--g700);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px}
.card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);
  padding:22px 24px;margin-bottom:16px;box-shadow:0 2px 10px rgba(15,36,56,.05)}
header.card{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.co{font-size:1.25rem;font-weight:800;color:var(--navy);line-height:1.2}
.co small{display:block;font-size:.8rem;font-weight:600;color:var(--g500);margin-top:4px}
.meta{text-align:right;font-size:.85rem;color:var(--g500)}
.meta .no{font-size:1.05rem;font-weight:800;color:var(--navy)}
h1{font-size:1.5rem;color:var(--navy);margin:0 0 6px;line-height:1.25}
h2{font-size:1.15rem;color:var(--navy);margin:0}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--g500);font-weight:800}
.scope{border-left:4px solid var(--orange);background:#fff8f3;padding:14px 18px;
  border-radius:0 8px 8px 0;margin-top:14px}
.opt{border:2px solid var(--g200);border-radius:var(--r);background:#fff;padding:20px 22px;margin-bottom:14px}
.opt.rec{border-color:var(--green)}
.opthead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.tag{background:#e9f7f0;color:var(--green);font-size:.66rem;text-transform:uppercase;
  letter-spacing:.06em;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.price{font-size:1.75rem;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;
  white-space:nowrap;line-height:1.1}
.price small{display:block;font-size:.76rem;font-weight:600;color:var(--g500)}
.blurb{color:var(--g500);margin:6px 0 0}
table{width:100%;border-collapse:collapse;margin:16px 0 8px}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--g500);
  text-align:left;border-bottom:1px solid var(--g200);padding:0 0 6px;font-weight:800}
th.n,td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td{padding:9px 0;border-bottom:1px solid var(--g100);vertical-align:top}
.det{color:var(--g500);font-size:.85rem;margin-top:2px}
.addons{margin-top:12px;padding-top:10px;border-top:1px dashed var(--g200)}
.sub{display:flex;justify-content:space-between;gap:12px;color:var(--g500);font-size:.9rem;padding:3px 0}
.war{margin-top:12px;color:var(--green);font-weight:700;font-size:.9rem}
.pickbtn{width:100%;margin-top:16px;background:var(--navy);color:#fff;border:none;
  border-radius:10px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer;
  font-family:inherit;min-height:52px}
.opt.rec .pickbtn{background:var(--green)}
.pickbtn:hover{opacity:.92}
.linky{background:none;border:none;color:var(--g500);text-decoration:underline;
  font-size:.9rem;cursor:pointer;font-family:inherit;padding:10px 0;min-height:44px}
.terms{white-space:pre-wrap;color:var(--g500);font-size:.88rem}
.foot{text-align:center;color:var(--g500);font-size:.8rem;padding:6px 0 0;line-height:2.6}
/* The footer phone number is a real tap target, not decoration: it is the
   fallback for a customer who has a question at 8pm and no other number. */
.foot a{color:var(--g500);display:inline-flex;align-items:center;min-height:44px;padding:0 6px}
.cta{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--g200);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));text-align:center;
  box-shadow:0 -3px 14px rgba(15,36,56,.08)}
.cta a{display:inline-block;background:var(--orange);color:#fff;font-weight:800;
  padding:14px 26px;border-radius:10px;text-decoration:none;min-height:50px}
.banner{padding:14px 18px;border-radius:10px;margin-bottom:16px;font-weight:600}
.banner.ok{background:#e9f7f0;color:var(--green);border:1px solid #b6e3ce}
.banner.warn{background:#fff3e0;color:#9a5b00;border:1px solid #f2d9b0}
.banner.err{background:#fdecea;color:#b3261e;border:1px solid #f5c2bf}
.ovl{position:fixed;inset:0;background:rgba(10,24,38,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:100;padding:0}
.sheet{background:#fff;border-radius:16px 16px 0 0;padding:22px;width:100%;max-width:520px;
  max-height:92vh;overflow-y:auto}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--g700);margin-bottom:5px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:13px;border:1px solid var(--g200);
  border-radius:9px;background:#fff;color:var(--g700)}
input:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:1px}
.btnrow{display:flex;gap:10px;margin-top:6px}
.btnrow button{flex:1;border-radius:10px;padding:14px;font-weight:800;font-size:.95rem;
  cursor:pointer;font-family:inherit;min-height:50px}
.b-go{background:var(--green);color:#fff;border:none}
.b-no{background:#fff;color:var(--g700);border:1px solid var(--g200)}
@media(min-width:560px){.ovl{align-items:center}.sheet{border-radius:16px}}
@media print{
  body{background:#fff}
  .cta,.pickbtn,.linky,.ovl{display:none !important}
  .card,.opt{box-shadow:none;break-inside:avoid}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="card"><p>Loading your estimate&hellip;</p></div>
</div>

<script>
window.SUPABASE_CONFIG = {
  url: "https://bghvhowpwbicojgwwirx.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnaHZob3dwd2JpY29qZ3d3aXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjI3NDcsImV4cCI6MjEwMjgzODc0N30.zgXQCv9mOuzHT0237HUOL1zBYZeBw5FSgXaUYYeVRyY"
};


var CFG = window.SUPABASE_CONFIG;
var TOKEN = new URLSearchParams(location.search).get("t") || "";
var DATA = null;

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function usd(n){
  return "$" + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function usd0(n){
  return "$" + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
}
async function rpc(fn, args){
  var r = await fetch(CFG.url + "/rest/v1/rpc/" + fn, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":CFG.anonKey,
              "Authorization":"Bearer " + CFG.anonKey },
    body: JSON.stringify(args||{})
  });
  if(!r.ok) throw new Error("Request failed");
  return r.json();
}
function el(id){ return document.getElementById(id); }

function notFound(){
  document.getElementById("root").innerHTML =
    '<div class="card"><h1>This link is not valid</h1>'
    + '<p>It may have expired, or the address may have been copied incompletely. '
    + 'Give us a call and we will send a fresh one.</p>'
    + '<p><a href="tel:+14803311017" style="color:var(--orange);font-weight:700">(480) 331-1017</a></p></div>';
}

function render(){
  var d = DATA, e = d.estimate, co = d.company || {};
  var decided = e.status === "accepted" || e.status === "declined";

  var banner = "";
  if(e.status === "accepted"){
    banner = '<div class="banner ok">Accepted on ' + new Date(e.decided_at).toLocaleDateString()
      + ' by ' + esc(e.signer_name || "") + '. We will call to schedule. Nothing else to do.</div>';
  } else if(e.status === "declined"){
    banner = '<div class="banner warn">You declined this estimate on '
      + new Date(e.decided_at).toLocaleDateString()
      + '. If that was a mistake, or things have changed, just call us.</div>';
  } else if(e.expired){
    banner = '<div class="banner warn">This estimate was good through '
      + new Date(e.valid_until + "T12:00:00").toLocaleDateString()
      + '. Material prices move, so call us to confirm before accepting.</div>';
  }

  var opts = (d.tiers||[]).map(function(t){
    var base = (t.items||[]).filter(function(i){ return !i.is_optional; });
    var adds = (t.items||[]).filter(function(i){ return i.is_optional; });
    var chosen = e.accepted_tier === t.tier;
    return '<section class="opt' + (t.recommended ? ' rec' : '') + '">'
      + '<div class="opthead"><div><h2>' + esc(t.label) + '</h2>'
        + (t.recommended ? '<span class="tag">Our recommendation</span>' : '')
        + (chosen ? '<span class="tag">You chose this</span>' : '')
        + (t.blurb ? '<p class="blurb">' + esc(t.blurb) + '</p>' : '')
      + '</div><div class="price">' + usd0(t.total)
        + (Number(e.deposit_pct) ? '<small>' + Number(e.deposit_pct) + '% deposit &middot; '
            + usd0(t.deposit) + '</small>' : '')
      + '</div></div>'
      + '<table><thead><tr><th>What is included</th><th class="n">Qty</th><th class="n">Amount</th></tr></thead><tbody>'
      + base.map(function(i){
          return '<tr><td>' + esc(i.description)
            + (i.detail ? '<div class="det">' + esc(i.detail) + '</div>' : '') + '</td>'
            + '<td class="n">' + Number(i.qty) + ' ' + esc(i.unit) + '</td>'
            + '<td class="n">' + usd(i.line_total) + '</td></tr>';
        }).join("")
      + '</tbody></table>'
      + (Number(t.tax) ? '<div class="sub"><span>Tax</span><span>' + usd(t.tax) + '</span></div>' : '')
      + (adds.length ? '<div class="addons"><div class="lbl">Optional add-ons</div>'
          + adds.map(function(i){
              return '<div class="sub"><span>' + esc(i.description) + '</span><span>+ '
                + usd(i.line_total) + '</span></div>';
            }).join("")
          + '<div class="det" style="margin-top:6px">Not included in the price above. '
          + 'Tell us if you want any of these and we will add them.</div></div>' : '')
      + (t.warranty ? '<div class="war">&#128737;&#65039; ' + esc(t.warranty) + '</div>' : '')
      + (decided ? '' : '<button class="pickbtn" data-pick="' + esc(t.tier) + '">Accept &mdash; '
          + esc(t.label) + '</button>')
      + '</section>';
  }).join("");

  el("root").innerHTML =
    '<header class="card"><div class="co">' + esc(co.company_name || "")
      + '<small>' + esc(co.company_contractor || "") + ' &middot; Arizona ' + esc(co.company_license || "") + '</small></div>'
      + '<div class="meta"><div class="no">' + esc(e.number) + '</div>'
      + new Date(e.created_at).toLocaleDateString()
      + (e.valid_until ? '<br>Good through ' + new Date(e.valid_until + "T12:00:00").toLocaleDateString() : '')
      + '</div></header>'
    + banner
    + '<div class="card"><h1>' + esc(e.title) + '</h1>'
      + '<div class="lbl" style="margin-top:12px">Prepared for</div>'
      + esc(e.customer_name || "")
      + (e.property_address ? '<div class="lbl" style="margin-top:10px">Property</div>' + esc(e.property_address) : '')
      + (e.scope_summary ? '<div class="scope"><strong>What we found</strong><br>' + esc(e.scope_summary) + '</div>' : '')
    + '</div>'
    + opts
    + (decided ? '' : '<div style="text-align:center"><button class="linky" id="decline">'
        + 'None of these work for me</button></div>')
    + (e.terms ? '<div class="card"><div class="lbl">Terms</div><div class="terms">' + esc(e.terms) + '</div></div>' : '')
    + '<div class="foot">' + esc(co.company_name || "") + ' &middot; '
      + '<a href="tel:+14803311017">(480) 331-1017</a> &middot; Arizona ' + esc(co.company_license || "")
      + ' &middot; licensed and insured</div>';

  Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"), function(b){
    b.onclick = function(){ decisionSheet("accept", b.getAttribute("data-pick")); };
  });
  if(el("decline")) el("decline").onclick = function(){ decisionSheet("decline", null); };

  if(!decided){
    var bar = document.createElement("div");
    bar.className = "cta";
    bar.innerHTML = '<a href="tel:+14803311017">&#128222; Questions? Call (480) 331-1017</a>';
    document.body.appendChild(bar);
  }
}

function decisionSheet(decision, tier){
  var accept = decision === "accept";
  var t = accept ? (DATA.tiers||[]).filter(function(x){ return x.tier===tier; })[0] : null;
  var ovl = document.createElement("div");
  ovl.className = "ovl";
  ovl.innerHTML = '<div class="sheet">'
    + '<h2>' + (accept ? "Accept " + esc(t.label) : "Let us know why") + '</h2>'
    + (accept
        ? '<p style="color:var(--g500)">' + usd0(t.total)
          + (Number(DATA.estimate.deposit_pct) ? ' &middot; ' + Number(DATA.estimate.deposit_pct)
             + '% deposit of ' + usd0(t.deposit) + ' when materials arrive' : '')
          + '. Typing your name here is your signature.</p>'
        : '<p style="color:var(--g500)">No hard feelings. A quick reason helps us do better.</p>')
    + '<div class="field"><label>Your full name</label><input id="sg" autocomplete="name"></div>'
    + '<div class="field"><label>' + (accept ? "Anything we should know" : "Reason") + ' (optional)</label>'
    + '<textarea id="nt" rows="2"></textarea></div>'
    + '<div id="er"></div>'
    + '<div class="btnrow"><button class="b-no" id="cx">Cancel</button>'
    + '<button class="' + (accept ? "b-go" : "b-no") + '" id="ok">'
    + (accept ? "Accept this estimate" : "Send it") + '</button></div></div>';
  document.body.appendChild(ovl);
  ovl.onclick = function(ev){ if(ev.target === ovl) document.body.removeChild(ovl); };
  el("cx").onclick = function(){ document.body.removeChild(ovl); };
  el("ok").onclick = async function(){
    var name = el("sg").value.trim();
    if(!name){
      el("er").innerHTML = '<div class="banner err">Please type your name.</div>';
      el("sg").focus(); return;
    }
    el("ok").disabled = true; el("ok").textContent = "Sending…";
    try{
      var res = await rpc("estimate_decide", {
        p_token: TOKEN, p_decision: decision, p_tier: tier,
        p_signer: name, p_note: el("nt").value.trim() || null
      });
      if(!res || !res.ok){
        if(res && res.reason === "already_decided"){ location.reload(); return; }
        throw new Error("Something went wrong. Please call us.");
      }
      document.body.removeChild(ovl);
      await load();
      window.scrollTo(0,0);
    }catch(err){
      el("er").innerHTML = '<div class="banner err">' + esc(err.message) + '</div>';
      el("ok").disabled = false;
      el("ok").textContent = accept ? "Accept this estimate" : "Send it";
    }
  };
}

async function load(){
  if(!TOKEN){ notFound(); return; }
  try{
    var d = await rpc("estimate_view", { p_token: TOKEN });
    if(!d || !d.ok){ notFound(); return; }
    DATA = d;
    var old = document.querySelector(".cta");
    if(old) old.parentNode.removeChild(old);
    render();
  }catch(e){ notFound(); }
}
load();
</script>
</body>
</html>
