<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridgeline</title>
<meta name="robots" content="noindex, nofollow">
<!-- The repo root had no index.html, which is what a static host serves when
     someone hits the bare URL. Vercel could not resolve a project root and
     failed the production deploy; GitHub Pages served a directory listing.

     This is a redirect rather than a copy of ridgeline.html on purpose. Two
     copies of a 170KB file drift apart the first time only one gets updated,
     and then the build stamp stops telling the truth about what you are
     looking at. One file stays the source of truth.

     Three layers so it works regardless of what the browser allows:
       1. the meta refresh, which needs no JavaScript
       2. the script, which fires faster and leaves no history entry, so the
          back button does not bounce the user straight back here
       3. the visible link, if both are blocked -->
<meta http-equiv="refresh" content="0; url=./ridgeline.html">
<link rel="canonical" href="./ridgeline.html">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #060a11; color: #8ba3c2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 15px; text-align: center; padding: 24px;
  }
  a { color: #38bdf8; }
</style>
<script>
  // replace() rather than assign() so this page never lands in history.
  location.replace("./ridgeline.html" + location.search + location.hash);
</script>
</head>
<body>
  <p>Opening Ridgeline&hellip;<br>
     <a href="./ridgeline.html">Continue &rarr;</a></p>
</body>
</html>
