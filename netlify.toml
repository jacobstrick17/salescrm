# Netlify config for the Phoenix Roofing Experts site.
# The deployed site is FLAT: every page sits at the root, no subfolders.
# Nothing here should reference /services/ or /service-areas/ any more.

[build]
  publish = "."
  command = ""

# Serve /roof-repair instead of /roof-repair.html when someone types it.
# Flat build, so slugs resolve straight off the root.
[[redirects]]
  from = "/:slug"
  to = "/:slug.html"
  status = 200
  force = false

# Custom 404 for anything unmatched.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Explicit content types for the crawler files.
# X-Content-Type-Options=nosniff above means a client will NOT guess the type,
# so if the host ever labels these as anything but XML/plain text, Googlebot
# refuses to parse them and reports "Sitemap could not be read". Stating the
# type here removes that whole failure mode.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
